# Castle + microSD audio — THE build for the ESP32-S2 Feather in the yard.
#
# It began as the experimental alternative to an all-in-flash image (the
# history is PROJECT_NOTES §12.9), ran the porch from 2026-08-22, and became
# the only build on 2026-09-01 when scenes 9 and 10 turned into real songs:
# 2.2 MB of audio cannot be embedded in a 1.75 MB OTA slot at any bitrate
# worth listening to, so castle_flash.yaml stopped compiling and was retired
# rather than nursed. docs/notes/03-build.md §12.15 has the decision.
#
#   make build         compile it
#   make upload        flash it over USB
#   make ota           build, stop audio, flash it over HTTP
#
# The show itself is castle_sd_common.yaml, which says nothing about which
# chip plays it. What is left HERE is the Feather: the board's own NeoPixel
# and the rail that powers it. The ESP32-S3 carrier build (castle_s3.yaml,
# 2026-09-05) includes the same show and has no such pixel — a WROOM-1 has
# none and does not bring GPIO33 out at all (docs/V5-SPEC.md §13.3). That is
# the whole reason this file and that one exist side by side rather than one
# of them extending the other: ESPHome packages APPEND lists, so a build
# cannot subtract a light its base declared.
#
# THE PART THAT WAS NOT PROVEN: nobody had published ESPHome SD audio on an
# ESP32-S2, and the two well-known ESP32 audio libraries decline to support
# the S2 at all. The porch has answered that by running it since 2026-08-22.
# What is gone with the flash build is the safety net: an empty card slot no
# longer falls back to embedded scenes, it plays the chirp. A card that is
# not in the socket is now a show that does not play, so `make publish`
# belongs in the same breath as `make ota`.

substitutions:
  name: castle-sd
  friendly: Castle SD

  # ── ONBOARD pixel, for now ───────────────────────────────────────────
  # The real rig: every zone on the pins castle.yaml declares (tower L on
  # A0/GPIO18 through the 74AHCT125). Until 2026-08-21 this file still
  # carried bench.yaml's `pin_towerL: "33"` (the onboard NeoPixel, plain
  # RGB) from before the jewels were soldered — so the porch build lit the
  # Feather's own pixel as tower L and the left jewel got no data at all.
  # Bench work belongs in bench*.yaml, never here.

packages:
  base: !include castle.yaml
  # The card, the loopback stream, the web server and its bridge — every
  # line of the show that does not care which chip is running it.
  sd: !include castle_sd_common.yaml

esphome:
  on_boot:
    # -190, so this lands BEFORE the card mount at -200: "I just rebooted",
    # in one pixel, is meant to be the first thing written to the onboard
    # NeoPixel — it clears the garbage the LED wakes up holding. The 2 s
    # status interval below turns it off a moment later if all is well.
    - priority: -190
      then:
        - light.turn_on:
            id: status_pixel
            brightness: 25%
            red: 0%
            green: 20%
            blue: 100%

# The onboard pixel is dark until its power rail (GPIO21) is driven high —
# same as bench.yaml. The rail stays on so the status pixel below can write.
switch:
  - platform: gpio
    id: neopixel_power
    pin: GPIO21
    restore_mode: ALWAYS_ON
    internal: true

# ── The onboard NeoPixel: DEVICE STATUS ONLY ─────────────────────────
# Appended to the generated strips (packages merge lists by appending), so it
# is allocated an RMT channel LAST and can never take one the show needs.
# It has no zone in scenes.yaml, which is what keeps it out of the show: no
# scene script and no /api/light can address it. Between status changes it is
# written once and then silent, so it costs the strips nothing.
#
# Until v5.31 this pixel WAS tower L (a bench leftover); with that gone and
# the rail still powered, it sat holding whatever garbage it woke up with.
light:
  - platform: esp32_rmt_led_strip
    id: status_pixel
    name: "Status pixel"
    pin: GPIO33
    num_leds: 1
    chipset: WS2812
    channel_colors: GRB
    # One S2 block — the fourth, and the reason gen_rig.py's budget report
    # says how many are spare.
    rmt_symbols: 64
    use_psram: false
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

interval:
  - interval: 2s
    then:
      - lambda: |-
          // The status pixel: blue while booting (written in on_boot, cleared
          // here once there is nothing to say), amber while an OTA burns
          // flash, red for a missing card, dark otherwise. Only a CHANGE
          // writes, so the RMT channel is idle between events.
          static uint8_t shown = 0xFF;
          const uint8_t want = castle_sd::g_quiesce ? 1
                             : (castle_sd::g_mounted ? 0 : 2);
          if (want != shown) {
            shown = want;
            if (want == 0) {
              id(status_pixel).turn_off().perform();
            } else {
              auto call = id(status_pixel).turn_on();
              call.set_brightness(0.25f);
              if (want == 1) call.set_rgb(1.0f, 0.55f, 0.0f);   // updating
              else call.set_rgb(1.0f, 0.0f, 0.0f);              // no card
              call.perform();
            }
          }
