# Castle + microSD audio (EXPERIMENTAL — see PROJECT_NOTES §12.9)
#
# The stock build embeds every scene in flash. This variant adds the ability
# to play arbitrary files off a microSD card as well, so the card can hold a
# library far larger than the ~2.9 MB flash budget.
#
#   make sd-build      compile this variant
#   make sd-upload     flash it
#
# HOW IT WORKS: ESPHome has no SD component and its audio pipeline cannot read
# a filesystem. But `audio::AudioFile` is just {pointer, length, type} and
# `SpeakerMediaPlayer::play_file()` is public — so sd_audio.h mounts the card
# over SPI, reads a whole file into PSRAM, and hands it to the ordinary
# decoder. See firmware/sd_audio.h for what that does and does not buy you.
#
# THE PART THAT IS NOT PROVEN: nobody has published ESPHome SD audio on an
# ESP32-S2, and the two well-known ESP32 audio libraries decline to support
# the S2 at all. This compiles; whether it plays cleanly on your board is an
# open question that only hardware answers. The flash scenes are untouched
# and keep working with no card in the slot, which is the safety net.

substitutions:
  name: castle-sd
  friendly: Castle SD

  # ── ONBOARD pixel, for now ───────────────────────────────────────────
  # No external jewels are soldered yet, so drive the Feather's own NeoPixel
  # (GPIO33, plain RGB) exactly like bench.yaml does: it plays pixel 0 of
  # towerL and the 20 pixels that don't exist fall off the end of the wire.
  # WHEN THE JEWELS ARE SOLDERED: wire their DIN (via the 74AHCT125) to A0,
  # then change these two lines to  pin_led_data: "18"  /  led_rgbw: "true".
  pin_led_data: "33"
  led_rgbw: "false"

  # ── SD pins: Adafruit 2.13" eInk FeatherWing (4128 / 4195 / 4814) ────
  # Adafruit documents one convention for the whole eInk FeatherWing family —
  # SD CS on D5, SRAM CS on D6, eInk CS on D9, eInk D/C on D10 — and it does
  # not vary by revision. SCK/MOSI/MISO are the fixed Feather SPI header.
  sd_cs: "5"            # D5
  sd_sck: "36"          # SCK
  sd_mosi: "35"         # MOSI
  sd_miso: "37"         # MISO

  # The other two chip selects on the shared SPI bus. We don't use the eInk
  # panel or its SRAM, but their CS lines still sit on the bus — and a
  # floating chip select is a device that may answer when the card is being
  # addressed. Both get driven HIGH (deselected) at boot and left there.
  # This is the difference between "the card works" and "the card works most
  # of the time", which is the worst kind of bug to chase on a porch.
  eink_cs: "9"          # D9
  sram_cs: "6"          # D6

packages:
  base: !include castle.yaml

# ESPHome tunes ESP-IDF for its own filesystem use — a FAT image on a flash
# partition behind the wear-levelling layer — and both of its defaults are
# wrong for a real SD card. Neither failure is loud: the card mounts, reports
# its correct name and size, and then nothing works.
#
#   VFS_SUPPORT_DIR=n    ESPHome turns directory support off to save flash,
#                        because it never lists anything. That removes
#                        opendir/readdir entirely, so listing the card failed
#                        with an errno the FATFS layer cannot even produce —
#                        which is what made it look like a card fault.
#
#   FATFS_SECTOR_4096    Correct for wear-levelled flash. An SD card reports
#                        512-byte sectors (this one does: "sector 512" in the
#                        mount log), and FATFS built for 4096 misreads it.
esp32:
  framework:
    sdkconfig_options:
      CONFIG_VFS_SUPPORT_DIR: "y"
      CONFIG_FATFS_SECTOR_4096: "n"
      CONFIG_FATFS_SECTOR_512: "y"
      # Long filenames, so "Halloween Songs - Ghostbusters.mp3" survives
      # instead of arriving as HALLOW~1.MP3. ESPHome defaults this off too.
      CONFIG_FATFS_LFN_NONE: "n"
      CONFIG_FATFS_LFN_HEAP: "y"

esphome:
  includes:
    - sd_audio.h
    - sd_web.h
  on_boot:
    # A LIST, not a mapping, and that matters more than it looks. ESPHome
    # merges a package's lists by appending them, but a mapping written over a
    # list REPLACES it — so spelling this `priority: -200` at the top level
    # silently deleted every on_boot entry castle.yaml had, including the
    # `light.turn_on` + `scene_vigil` at -100. The SD build booted with its
    # pixels dark and its opening scene never started, and nothing said so.
    - priority: -200
      then:
        # Park the eInk and SRAM chip selects HIGH before touching the bus.
        - output.turn_on: eink_cs_park
        - output.turn_on: sram_cs_park
        - lambda: |-
            if (castle_sd::mount(${sd_cs}, ${sd_sck}, ${sd_mosi}, ${sd_miso})) {
              castle_sd::list_root();
            }
            // Started whether or not the card mounted: the server is also how
            // you find out the card is missing without walking to the castle.
            castle_web::start();

# The onboard pixel is dark until its power rail (GPIO21) is driven high —
# same as bench.yaml. Harmless once the real jewels take over: GPIO21 is clear
# of the eInk wing and everything else on this build.
switch:
  - platform: gpio
    id: neopixel_power
    pin: GPIO21
    restore_mode: ALWAYS_ON
    internal: true

# Held deselected for the life of the device — see the note in substitutions.
# These chip selects are active-low, so deselected means driven HIGH, which is
# plain `output.turn_on` with no inversion.
output:
  - platform: gpio
    id: eink_cs_park
    pin: GPIO${eink_cs}
  - platform: gpio
    id: sram_cs_park
    pin: GPIO${sram_cs}

# Play any file from the card:  /sd/<name>
#
#   - script.execute:
#       id: play_sd
#       path: "spooky/organ.mp3"
script:
  - id: play_sd
    mode: restart
    parameters:
      path: string
    then:
      - lambda: |-
          // Stop first: a new load frees the PSRAM buffer the decoder may
          // still be reading. Stopping before the (100+ ms) load starts gives
          // the pipeline time to let go of the old buffer.
          id(castle_media)->make_call()
              .set_command(esphome::media_player::MEDIA_PLAYER_COMMAND_STOP)
              .set_announcement(true)
              .perform();
          // The read happens on its own task — a megabyte over SPI takes the
          // better part of a second, and the main loop must keep the lights
          // moving. The 200 ms interval below picks up the finished file.
          castle_sd::start_load(path.c_str());

# The bridge between the web server's httpd task and ESPHome's main loop.
# HTTP handlers only *record* play/scene/stop requests (scripts and the media
# player are not thread-safe off the loop); this picks them up and runs them.
# 200 ms of latency on a button press is imperceptible next to an MP3 spin-up.
interval:
  - interval: 200ms
    then:
      - lambda: |-
          // A finished SD load, if one landed. announcement:true matches how
          // the generated scene scripts play — this device only defines the
          // announcement pipeline.
          auto *f = castle_sd::take_ready();
          if (f != nullptr) id(castle_media)->play_file(f, true, false);

          // Mirror the real volume out to the web server's status endpoint —
          // the httpd task must never read ESPHome objects itself.
          castle_web::g_volume.store((int) (id(castle_media)->volume * 100.0f + 0.5f));

          auto act = castle_web::take_pending();
          if (act.type == castle_web::NONE) return;
          if (act.type == castle_web::PLAY) {
            id(play_sd)->execute(act.arg);
          } else if (act.type == castle_web::STOP) {
            id(scene_stop)->execute();
          } else if (act.type == castle_web::VOLUME) {
            auto call = id(castle_media)->make_call();
            call.set_volume(atoi(act.arg.c_str()) / 100.0f);
            call.perform();
          } else if (act.type == castle_web::LIGHT) {
            // Manual override for the chain — today that is the one onboard
            // pixel (it plays towerL pixel 0), later all three jewels.
            if (act.arg == "off") {
              id(castle_leds).turn_off().perform();
            } else if (act.arg == "show") {
              auto call = id(castle_leds).turn_on();
              call.set_effect("Show");
              call.perform();
            } else {
              long v = strtol(act.arg.c_str(), nullptr, 16);
              auto call = id(castle_leds).turn_on();
              call.set_effect("None");   // park on the colour, no animation
              call.set_brightness(1.0f);
              call.set_rgb(((v >> 16) & 0xFF) / 255.0f,
                           ((v >> 8) & 0xFF) / 255.0f,
                           (v & 0xFF) / 255.0f);
              call.perform();
            }
          } else if (act.type == castle_web::SCENE) {
            // Generated scene scripts, by bare name. A miss is logged, not
            // silent — a typo in a URL should say so.
            if      (act.arg == "vigil")      id(scene_vigil)->execute();
            else if (act.arg == "storm")      id(scene_storm)->execute();
            else if (act.arg == "seance")     id(scene_seance)->execute();
            else if (act.arg == "ballroom")   id(scene_ballroom)->execute();
            else if (act.arg == "descent")    id(scene_descent)->execute();
            else if (act.arg == "visitation") id(scene_visitation)->execute();
            else if (act.arg == "approach")   id(scene_approach)->execute();
            else if (act.arg == "crypt")      id(scene_crypt)->execute();
            else ESP_LOGW("castle_web", "unknown scene '%s'", act.arg.c_str());
          }

# A card check you can see in Home Assistant without reading logs.
binary_sensor:
  - platform: template
    name: "SD card present"
    lambda: "return castle_sd::g_mounted;"

# ── SD diagnostics, driven remotely ──────────────────────────────────
# The mount and its listing happen at boot priority -200, before the API is
# up, so their log lines are gone by the time anything can read them. The boot
# log ring (boot_log.h) keeps them, and these re-run the checks on demand —
# which is what you want when the card is swapped without a reboot.
button:
  - platform: template
    name: "List SD card"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          if (!castle_sd::g_mounted) {
            ESP_LOGW("castle_sd", "not mounted — mounting now");
            castle_sd::mount(${sd_cs}, ${sd_sck}, ${sd_mosi}, ${sd_miso});
          }
          castle_sd::list_root();

  # A stuck FATFS lock cannot be waited out — see remount() for why. This is
  # the recovery, and pressing it is also the experiment that tells us whether
  # the lock is the fault or the card is.
  - platform: template
    name: "Remount SD"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          castle_sd::remount(${sd_cs}, ${sd_sck}, ${sd_mosi}, ${sd_miso});
          castle_sd::list_root();

  # Plays whatever `SD file` names. Separate from the script so it can be
  # pressed from anywhere that speaks the API, with no YAML edit.
  - platform: template
    name: "Play SD file"
    entity_category: config
    on_press:
      - script.execute:
          id: play_sd
          path: !lambda 'return id(sd_path).state;'

text:
  - platform: template
    name: "SD file"
    id: sd_path
    optimistic: true
    mode: text
    # Relative to the card root: sd_audio.h prefixes /sd/.
    initial_value: "test.mp3"
    entity_category: config
