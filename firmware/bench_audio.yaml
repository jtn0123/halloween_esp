# Audio benchmark — the bare Feather, no speakers and no jewels. It DOES need
# the microSD socket and the show card now: this measured embedded audio until
# the all-in-flash build was retired (2026-09-01, docs/notes/03-build.md
# §12.15), and the scene tracks stream off the card since. Run `make publish`
# first (or put the show card in) or every scene decodes the fallback chirp
# and the numbers below mean nothing.
#
#   make bench-audio        flash it
#   make bench-audio-logs   watch the numbers
#
# WHY THIS EXISTS: it was written because every claim about what an ESP32-S2
# could decode was folk wisdom — Espressif published numbers for the ESP32 and
# the S3 and none for the S2, and both well-known ESP32 audio libraries
# declined to support it. PROJECT_NOTES §12.13 is the answer it got: 96 kbps
# MP3 off the card, zero underruns. The S2 was retired on 2026-09-17 and this
# file kept its job: the numbers for THIS chip and this show have not been
# measured either, and a measured board beats an inherited assumption.
#
# WHAT IT MEASURES: the pipeline runs in full — MP3 decode, resample, I2S out —
# with WiFi up and the LED RMT driver running. On the S2 that was single-core
# contention and the whole risk; on the S3 there is a second core, so the
# number to watch is not the same number, which is the reason to re-run it
# rather than to assume. The I2S pins just have nothing listening, so no amp
# or speaker is needed.
#
#   loop_time   the number that matters. ESPHome's main loop shares the core
#               with decoding. If this climbs under audio, the decoder is
#               starving everything else, and light cues will jitter.
#   free RAM    internal SRAM. I2S cannot DMA from PSRAM, so its buffers live
#               here. On the S2 this was the tighter of the two pools by far;
#               on the S3 flash is the tight resource and this one has room.
#   PSRAM       headroom for a whole-file SD load (see PROJECT_NOTES §12.9).
#
# HOW TO READ IT: idle for 30 s, then each scene plays in turn with a banner
# in the log. Compare loop_time idle vs during playback.
#   - loop_time stays under ~30 ms      -> comfortable, MP3 is fine
#   - climbs to 50-100 ms               -> decoding, but cues will drift
#   - warnings about the component loop -> not keeping up; drop to WAV
# Any "underrun", "Failed to decode" or "decoder error" line is the pipeline
# failing outright, and is the answer on its own.

substitutions:
  name: castle-benchaudio
  friendly: Castle Audio Bench
  # NO pin override any more. This used to point tower L at the onboard
  # NeoPixel (GPIO33) so a bare board could show the candle flicker, which
  # worked while the base was castle_flash.yaml and nothing else wanted that
  # pin. The show build claims GPIO33 for its own status pixel, and ESPHome
  # refuses two strips on one pin outright — so all three zones now clock
  # into unconnected pins (which costs nothing) and the onboard pixel says
  # what the DEVICE is doing instead of what tower L is. (2026-09-01)

packages:
  # The show build, not the core — see the note in bench.yaml.
  base: !include castle_feather_s3.yaml

# NO `switch:` for the onboard pixel's power rail here any more. Both bench
# files carried their own copy while they based on castle_flash.yaml, which
# had none; the show build declares neopixel_power itself (it drives the
# status pixel), and a second declaration is a hard "ID redefined" error
# rather than a merge. (2026-09-01)

logger:
  level: DEBUG          # the audio pipeline reports underruns at DEBUG
  # Console routing lives in castle.yaml — it is needed by every variant,
  # not just this one.

debug:
  update_interval: 2s

sensor:
  - platform: debug
    free:
      name: "Free internal RAM"
      id: dbg_free
    loop_time:
      name: "Loop time"
      id: dbg_loop
    psram:
      name: "Free PSRAM"
      id: dbg_psram

text_sensor:
  - platform: debug
    device:
      name: "Device info"
    reset_reason:
      name: "Reset reason"

interval:
  # One greppable line per sample, so a run can be read straight out of the
  # log without the API or Home Assistant.
  - interval: 2s
    then:
      - lambda: |-
          ESP_LOGI("bench", "loop_max=%.0fms  int_ram=%.0fB  psram=%.0fB  playing=%s",
                   id(dbg_loop).state, id(dbg_free).state, id(dbg_psram).state,
                   id(castle_media)->state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING
                     ? "yes" : "no");

script:
  # v5.67: `scene_<id>` scripts no longer exist — a scene is a cue file on
  # the card and `run_scene` is the one door. With no card in the slot each
  # of these wears the built-in fallback look and plays the embedded chirp,
  # which is still exactly the dry run this file wants: the pipeline runs and
  # nothing needs soldering. Put a published card in and it is the real show.
  - id: run_benchmark
    mode: restart
    then:
      - logger.log: "=== BENCH: 30 s idle baseline (lights only, no audio) ==="
      - script.execute: scene_stop
      - delay: 30s
      - logger.log: "=== BENCH: vigil — 30 s loop, wind bed, light cue load ==="
      - script.execute: {id: run_scene, scene: vigil}
      - delay: 35s
      - logger.log: "=== BENCH: crypt — 78 beat cues, the heaviest cue load ==="
      - script.execute: {id: run_scene, scene: crypt}
      - delay: 30s
      - logger.log: "=== BENCH: descent — 27 s showpiece, densest audio ==="
      - script.execute: {id: run_scene, scene: descent}
      - delay: 30s
      - logger.log: "=== BENCH: storm — short, loudest transient ==="
      - script.execute: {id: run_scene, scene: storm}
      - delay: 10s
      - logger.log: "=== BENCH: done. Compare loop_max idle vs playing. ==="
      - script.execute: scene_stop

esphome:
  on_boot:
    priority: -300      # after the base config has started its scene
    then:
      - delay: 5s
      - script.execute: run_benchmark

button:
  - platform: template
    name: "Run benchmark"
    on_press:
      - script.execute: run_benchmark
