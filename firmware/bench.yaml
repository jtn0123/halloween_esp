# Bench dry-run — the bare ESP32-S2 Feather, ZERO extra parts.
#
#   .venv/bin/esphome run firmware/bench.yaml
#
# What this proves before the jewels and amp arrive:
#   - the open risk from PROJECT_NOTES §12.4: MP3 decode + WiFi + RMT all at
#     once on a single core. The audio pipeline runs in full; the I2S pins
#     just have nothing listening. Watch `esphome logs` for buffer underruns.
#     One caveat since the flash build was retired (2026-09-01): the scene
#     tracks live on the card now, so with an empty slot each scene decodes
#     the one-second chirp instead of its song and the decode risk is NOT
#     what this run measures. Put the show card in the wing for that, or use
#     bench_audio.yaml, which exists to measure exactly it.
#   - the whole scene engine: cue timing, effect switching, PIR debounce
#     (GPIO6 is pulled down, so it stays quiet unwired).
#   - that the board comes up, joins WiFi and serves the desk: the ONBOARD
#     NeoPixel (GPIO33) is the show build's status pixel, so it is the one
#     thing on a bare Feather you can actually watch.
#
# It used to be tower L's strip instead — you could see the candle flicker on
# the board itself — but that trick died with the flash build (see the
# substitutions below). All three zones now clock out into unconnected pins
# harmlessly, and the cue timings are read from the log, not from a pixel.

substitutions:
  name: castle-bench
  friendly: Castle Bench
  # NO pin override any more. This used to point tower L at the onboard
  # NeoPixel (GPIO33) so a bare board could show the candle flicker, which
  # worked while the base was castle_flash.yaml and nothing else wanted that
  # pin. The show build claims GPIO33 for its own status pixel, and ESPHome
  # refuses two strips on one pin outright — so all three zones now clock
  # into unconnected pins (which costs nothing) and the onboard pixel says
  # what the DEVICE is doing instead of what tower L is. (2026-09-01)

packages:
  # The show build, not the core: the bench needs an `sfx` dispatch script,
  # and castle.yaml deliberately defines none. It used to base on
  # castle_flash.yaml, which carried the whole show in the image; since that
  # build was retired (2026-09-01, docs/notes/03-build.md §12.15) the show
  # build is castle_sd.yaml. With no card in the slot every scene plays the
  # embedded chirp instead of its track, which is exactly what this dry run
  # wants: the pipeline runs, the cues run, and nothing needs soldering.
  base: !include castle_sd.yaml

# NO `switch:` for the onboard pixel's power rail here any more. Both bench
# files carried their own copy while they based on castle_flash.yaml, which
# had none; castle_sd.yaml declares neopixel_power itself (it drives the
# status pixel), and a second declaration is a hard "ID redefined" error
# rather than a merge. (2026-09-01)
