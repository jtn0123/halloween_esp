# Bench dry-run — the bare ESP32-S2 Feather, ZERO extra parts.
#
#   .venv/bin/esphome run firmware/bench.yaml
#
# What this proves before the jewels and amp arrive:
#   - the open risk from PROJECT_NOTES §12.4: MP3 decode + WiFi + RMT all at
#     once on a single core. The audio pipeline runs in full; the I2S pins
#     just have nothing listening. Watch `esphome logs` for buffer underruns.
#   - the whole scene engine: cue timing, effect switching, PIR debounce
#     (GPIO6 is pulled down, so it stays quiet unwired).
#   - the ONBOARD NeoPixel (GPIO33) plays pixel 0 of towerL — you can watch
#     the candle flicker, strikes and palette changes on the board itself.
#
# The onboard pixel is plain RGB, so tower L's colour type is overridden. Its
# other six pixels, and the two zones nothing is wired to, clock out into
# unconnected pins harmlessly.

substitutions:
  name: castle-bench
  friendly: Castle Bench
  # The onboard pixel replaces tower L's strip: same pin substitution as
  # before, now per zone. It plays tower L's pixel 0 and the rest of that
  # zone falls off the end of a wire that is not there. The other two zones
  # keep their real pins and clock into thin air, which costs nothing.
  pin_towerL: "33"      # onboard NeoPixel
  channels_towerL: "GRB"  # the onboard pixel is plain RGB

packages:
  # The flash variant, not the core: the bench needs `sfx` + embedded audio
  # too, and castle_flash.yaml is exactly "castle with audio in the image".
  base: !include castle_flash.yaml

# The onboard pixel is dark until its power rail (GPIO21) is driven high.
switch:
  - platform: gpio
    id: neopixel_power
    pin: GPIO21
    restore_mode: ALWAYS_ON
    internal: true
