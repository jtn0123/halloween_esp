# The castle on the ESP32-S3-WROOM-1 carrier board (castle-carrier v5).
#
#   make build-s3      compile it
#   make upload-s3     flash it over USB (native USB — no adapter, no BOOT dance)
#   make logs-s3       tail its logs
#
# This is the SECOND build, not the castle. The castle is an ESP32-S3 Feather
# (castle_feather_s3.yaml) and has been since 2026-09-17; this one waits for a
# v5 carrier to plug in. The two share everything that is show
# (castle.yaml + castle_sd_common.yaml) — and since the S2's retirement they
# share the chip too, so what is left here is only what is BOARD:
#
#   1. the platform — variant alone, no Feather board definition     (§13.1)
#      and 8 MB of flash against the Feather's 4                     (§13.6)
#   2. no on-board NeoPixel, and no GPIO33 to hang one on            (§13.3)
#   3. an ammeter on the 5 V rail, which no Feather ever had          (§13.7)
#
# Section numbers are docs/V5-SPEC.md, which is the port's written recipe and
# lives with the board, not in this repo.
#
# Two differences this file used to carry are gone, because castle.yaml now
# describes an S3: the USB Serial/JTAG console (§13.1) and the 48-word RMT
# blocks (§13.4) are the base's, and generated/lights_s3.yaml — the package of
# `!extend`s that re-spent every strip's block in S3 units — was deleted when
# it had nothing left to say (2026-09-17).
#
# NOT ONE PIN NUMBER CHANGES. Every GPIO castle.yaml and castle_sd_common.yaml
# name exists on a WROOM-1 and is legal there (V5-SPEC §2.1) — that is why
# the carrier forbids an octal-PSRAM module (GPIO35/36/37 are the card's SPI)
# and why I2C went to GPIO1/2 instead of moving the SD bus.
#
# NOTHING HERE HAS EVER BEEN ON HARDWARE. It compiles, weekly, in CI; the
# board does not exist yet. firmware/pending/README.md carries the bring-up
# list. That sentence WAS true of the S3 Feather build as well until
# 2026-09-17; it is now true of this file alone.

substitutions:
  name: castle-s3
  friendly: Castle S3

packages:
  base: !include castle.yaml
  # The card, the loopback stream, the web server and its bridge — every
  # line of the show that does not care which chip is running it.
  sd: !include castle_sd_common.yaml

# ── 1. The platform ──────────────────────────────────────────────────
# `variant:` alone is ESPHome's own recommended spelling, and `board:` is
# kept only for backwards compatibility. A bare WROOM-1 soldered to a custom
# carrier HAS no board definition worth naming, so the Feather's is removed
# outright rather than swapped for a devkit's — `!remove` deletes the key the
# base package set, which is the only way to unset it (a `board:` and a
# `variant:` that disagree is a hard error). With the ESP-IDF toolchain the
# board string is informational anyway.
#
# The whole framework block otherwise carries over unchanged, INCLUDING the
# dram0 diet. Those lines were bought with an ESP32-S2's static RAM and every
# one of them is now a line to give back and measure (V5-SPEC §13.5 lists
# which); that measuring happens on the Feather, which is the board that
# exists, and this build inherits the answer.
esp32:
  board: !remove
  variant: esp32s3
  # ESP32-S3-WROOM-1-N8R2: 8 MB of flash against the Feather's 4 MB, which
  # is what makes the dual-OTA slots stop being the thing every decision is
  # measured against (§13.6). It does NOT bring the all-in-flash build back
  # — the show streams off the card here exactly as it does on the porch.
  flash_size: 8MB

# ── The console: the same as the base's, said out loud ───────────────
# Redundant since 2026-09-17 — castle.yaml names USB_SERIAL_JTAG now, because
# the Feather has the peripheral too. Kept anyway: UART0 on this board is
# GPIO43/44 brought out to J10, so if the base ever goes back to a UART the
# carrier's console must not silently follow it to a header pin nobody has an
# adapter on. Repeating a value is cheap; discovering a console moved is not.
logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

# ── 2. No status pixel ───────────────────────────────────────────────
# There is nothing to delete: castle_feather_s3.yaml holds the on-board
# NeoPixel and its GPIO21 rail, and this build simply does not include that
# file. A WROOM-1 has no such LED and does not bring GPIO33 out at all
# (§13.3) — so on this board the RMT budget is three strips and one whole TX
# channel spare, where the Feather spends all four (tools/gen_rig.py's
# banner states both). If a boot indicator is ever wanted, the carrier's
# SPARE zone (GPIO8 → U1 channel 4 → J4 / J12 pin 4) is a real 5 V pixel
# output with a terminal and a test point already on it.

# ── 3. The ammeter, which no Feather ever had ────────────────────────
# The carrier measures its own 5 V rail: an INA219 across a 10 mΩ shunt at
# 0x41 (a Qwiic breakout would be 0x40). This is bring-up step 9's
# instrument and the answer to V5-SPEC open question 1 — how much the show
# actually draws — so it exists before the board does, and reads zero on a
# bench with no shunt rather than being written in a hurry on flash day.
i2c:
  sda: GPIO1
  scl: GPIO2
  # The carrier's 4.7 k pull-ups give ~226 ns of rise, inside Fast-mode's
  # 300 ns budget (V5-SPEC §6.4).
  frequency: 400kHz
  scan: true

sensor:
  - platform: ina219
    address: 0x41
    shunt_resistance: 0.01 ohm
    max_voltage: 16.0V      # BRNG = 0
    max_current: 8A         # PGA = /2, ±80 mV across 10 mΩ
    update_interval: 10s
    current:
      name: "Castle 5V current"
    bus_voltage:
      name: "Castle 5V rail"
    power:
      name: "Castle 5V power"
