# The castle's inputs — the PIR that starts the show and the buttons that
# drive it by hand. Split from castle.yaml at the entity seam when both
# files pressed the 500-line cap; merged back in by `packages:` (a key that
# exists only here cannot collide, so ESPHome's replace-on-mapping rule
# never comes into play).

binary_sensor:
  - platform: gpio
    id: walkway_pir
    name: "Walkway motion"
    pin:
      number: GPIO${pin_pir}
      # Pulldown, not bare input: the AM312 drives high actively, and on a
      # bench board with nothing wired a floating pin would fire the Approach
      # scene at random.
      mode:
        input: true
        pulldown: true
    filters:
      # One trigger per approach, not one per twitch.
      - delayed_off: 8s
    on_press:
      then:
        # Which scene, how often, and whether at all — all runtime settings
        # (see the generated pir_* entities), not code. The cooldown is the
        # difference between a haunted castle and a car alarm.
        # L3 (v5.62): every one of these three outcomes is now a line in the
        # event ring. Until now the PIR — the thing that drives most of a
        # real night — was recorded by NOTHING: record_action is only
        # reached from the web mailbox, and a trip the cooldown swallowed
        # returned here without even a log line. "The castle did nothing
        # between 8 and 9" and "the castle was triggered forty times and
        # suppressed all of them" looked identical the next morning.
        #
        # Every build that compiles this file also compiles the web layer
        # (castle.yaml is not a buildable target — see the note atop it —
        # and every target that includes it includes castle_sd_common.yaml),
        # so castle_web is always in reach here.
        - lambda: |-
            static uint32_t last_ms = 0;
            const int64_t now_us = esp_timer_get_time();
            // A `text`, not a `select`, since v5.69 (J1, grade report
            // 2026-09-17 pm): the ids come off the card, so the entity that
            // names which scene motion fires cannot carry a compiled list.
            // /api/pir refused anything the card does not list before this
            // value was ever stored (sd_web.h h_pir); a name the card has
            // since lost is a scene_run that wears the fallback look and
            // says so, which is the same outcome a stale option had.
            const std::string want = id(pir_scene).state;
            if (!id(pir_armed).state) {
              castle_web::record_event(castle_web::EventKind::PIR_OFF, "", now_us);
              return;
            }
            const uint32_t now = millis();
            const uint32_t hold = (uint32_t)(id(pir_cooldown).state * 1000.0f);
            if (last_ms != 0 && (now - last_ms) < hold) {
              // The arg is how many seconds of the cooldown were left, which
              // is what tells a busy pavement from a cooldown set too long.
              castle_web::record_event(castle_web::EventKind::PIR_COOLDOWN,
                                       std::to_string((hold - (now - last_ms)) / 1000),
                                       now_us);
              return;
            }
            last_ms = now;
            castle_web::record_event(castle_web::EventKind::PIR, want, now_us);
            ESP_LOGI("castle", "motion -> scene '%s'", want.c_str());
            id(run_scene)->execute(want);

button:
  # ── Diagnostics ──────────────────────────────────────────────────
  # Everything the board did before the API came up. This is the only way to
  # see the boot sequence on a device with no serial console — see boot_log.h.
  - platform: template
    name: "Dump boot log"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          castle_web::record_event(castle_web::EventKind::BUTTON, "bootlog",
                                   esp_timer_get_time());
          castle_log::dump();

  # ── Remote flashing escape hatch ─────────────────────────────────
  # OTA (PUT /api/ota, `make ota`) is how firmware normally arrives. This is
  # the last resort for when the network is gone: without it, new firmware
  # means physically holding BOOT and tapping RESET — fine at the desk,
  # useless once the castle is on a porch and you are not. The S2 Feather
  # has no USB serial console to fall back on; the S3 carrier does, and the
  # button is still nearer than the porch.
  #
  # The ROM (S2 and S3 alike) checks a bit in an always-on RTC register at
  # boot. Set
  # it, reboot, and the chip comes up with its USB bootloader enumerated,
  # ready for esptool over the wire. No buttons.
  #
  # A button, not a service, on purpose: pressing it takes the show off the air.
  - platform: template
    name: "Enter flash mode"
    entity_category: config
    on_press:
      - logger.log: "rebooting into download mode — reflash over USB to recover"
      # L3: the last line the ring gets before the ROM takes the board. A
      # castle found in download mode the next morning is otherwise a
      # complete mystery — it looks exactly like a dead board.
      - lambda: |-
          castle_web::record_event(castle_web::EventKind::BUTTON, "flashmode",
                                   esp_timer_get_time());
      - delay: 300ms          # let the log and the API response get out
      - lambda: 'castle_sd::reboot_to_download_mode();'
  - platform: template
    name: "Scene: Vigil"
    on_press:
      # L3: which BUTTON was pressed. run_scene logs the scene start
      # itself; this is the one bit only the button knows.
      - lambda: |-
          castle_web::record_event(castle_web::EventKind::BUTTON, "vigil",
                                   esp_timer_get_time());
      - script.execute: {id: run_scene, scene: vigil}
  - platform: template
