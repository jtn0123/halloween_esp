# The microSD show, without a word about which chip is playing it.
#
# Split out of castle_sd.yaml on 2026-09-05, when the ESP32-S3 carrier build
# (castle_s3.yaml) needed every line of it EXCEPT the S2 Feather's on-board
# NeoPixel. That pixel is the whole seam: a WROOM-1 has no such LED and does
# not even bring GPIO33 out (docs/V5-SPEC.md §13.3), and ESPHome packages
# append lists rather than subtract from them — so the thing one build has
# and the other cannot must live in the file only one build includes.
#
# What is here: the card mount, the loopback stream, the web server and the
# mirror half of its main-loop bridge, the SD diagnostics.
# (The dispatch half — the mailbox's if/else chain — is
# castle_web_actions.yaml, a package this one includes.) What is NOT:
# `name`/`friendly` (the build's identity), the platform, and the status
# pixel. Nothing here names a chip.
#
# HOW IT WORKS: ESPHome has no SD component and its audio pipeline cannot read
# a filesystem — but it can read a URL. sd_audio.h mounts the card over SPI
# at /sd, sd_web_site.h serves any file on it at GET /sd/<path>, and playing
# a card file is the ordinary media_player URL call pointed at loopback:
# http://127.0.0.1:8080/sd/<file>. True streaming, no PSRAM cap. See
# firmware/sd_audio.h for the whole story.

substitutions:
  # ── SD pins ──────────────────────────────────────────────────────────
  # The carrier board's microSD socket sits on the Feather's SPI header with
  # its chip select on D5 — the same pin the eInk FeatherWing used for its
  # card slot, so the card needed no re-wiring when the wing went. The wing
  # itself (and the status panel v5.11–v5.43 drew on it, with its parked
  # SRAM/eInk chip selects on D6/D9/D10) is gone since v5.44: its job moved
  # to the web page, and D6/D9/D10 are free for the carrier — a 5 V sense
  # divider on D6 and the wired button on D10.
  #
  # All four numbers survive the ESP32-S3 port unchanged: GPIO35/36/37 are
  # free on a QUAD-PSRAM WROOM-1 and belong to the PSRAM die only on the
  # octal parts, which is why docs/V5-SPEC.md §1.1 forbids an …R8 module.
  sd_cs: "5"            # D5
  sd_sck: "36"          # SCK
  sd_mosi: "35"         # MOSI
  sd_miso: "37"         # MISO

packages:
  # This build's `sfx`: streams each track from the card over loopback (the
  # core deliberately defines none — see the note atop castle.yaml).
  audio_sd: !include generated/audio_sd.yaml
  # v5.63: a card song's own light show — cues_begin / cues_end, called below.
  cues: !include castle_cues.yaml
  # v5.67: the show itself, read from the card — `scene_run` (the one generic
  # scene runner `run_scene` dispatches to) and the boot manifest check.
  scenes: !include castle_scenes.yaml
  # v5.70: the other half of the 200 ms bridge below — `web_action`, the
  # script that runs whatever the web server recorded. Split out for the
  # 500-line rule; the tick still calls it inline, in the same order.
  web_actions: !include castle_web_actions.yaml

# The build embeds ONE file: a chirp that plays when a scene starts with
# no card in the slot, so a missing card is audible instead of silent. Every
# scene track streams from /sd/scenes/ instead of living in flash — which is
# what keeps the image inside a 1.75 MB OTA slot no matter how long the show
# gets. The show weighed 2.2 MB the day this became the only build.
media_player:
  - id: !extend castle_media
    files:
      - id: snd_chirp
        file: ../audio/00_chirp.mp3

# ESPHome tunes ESP-IDF for its own filesystem use — a FAT image on a flash
# partition behind the wear-levelling layer — and both of its defaults are
# wrong for a real SD card. Neither failure is loud: the card mounts, reports
# its correct name and size, and then nothing works.
#
#   VFS_SUPPORT_DIR=n    ESPHome turns directory support off to save flash,
#                        because it never lists anything. That removes
#                        opendir/readdir entirely, so listing the card failed
#                        with an errno the FATFS layer cannot even produce —
#                        which is what made it look like a card fault.
#
#   FATFS_SECTOR_4096    Correct for wear-levelled flash. An SD card reports
#                        512-byte sectors (this one does: "sector 512" in the
#                        mount log), and FATFS built for 4096 misreads it.
#
# All of it is a fact about SD cards, not about the S2 — docs/V5-SPEC.md
# §13.5 keeps the whole block on the S3.
esp32:
  framework:
    # ESPHome 2026.9 stopped building the IDF components it has no use for,
    # and the card is one of them ("ESPHome doesn't use filesystem storage").
    # sd_audio.h does: FAT over SDSPI. So is the IDF's own HTTP server, which
    # sd_web.h registers its routes on and no ESPHome component here asks for.
    # Without these the build stops at esp_vfs_fat.h, then esp_http_server.h.
    # wear_levelling comes back by itself as fatfs's REQUIRES.
    advanced:
      include_builtin_idf_components:
        - fatfs
        - sdmmc
        - esp_driver_sdspi
        - esp_http_server
    sdkconfig_options:
      CONFIG_VFS_SUPPORT_DIR: "y"
      CONFIG_FATFS_SECTOR_4096: "n"
      CONFIG_FATFS_SECTOR_512: "y"
      # Long filenames, so "Halloween Songs - Ghostbusters.mp3" survives
      # instead of arriving as HALLOW~1.MP3. ESPHome defaults this off too.
      CONFIG_FATFS_LFN_NONE: "n"
      CONFIG_FATFS_LFN_HEAP: "y"

esphome:
  includes:
    - sd_audio.h
    - sd_web_util.h
    - sd_space.h
    - sd_web_ring.h
    - sd_web_state.h
    - sd_web_events.h
    - sd_web_stream.h
    - sd_web.h
    - generated/fallback_scenes.h
    - sd_web_ota.h
    - sd_web_upload.h
    - sd_web_site.h
    - sd_web_remote.h
  on_boot:
    # A LIST, not a mapping, and that matters more than it looks. ESPHome
    # merges a package's lists by appending them, but a mapping written over a
    # list REPLACES it — so spelling this `priority: -200` at the top level
    # silently deleted every on_boot entry castle.yaml had, including the
    # `light.turn_on` + `scene_vigil` at -100. The SD build booted with its
    # pixels dark and its opening scene never started, and nothing said so.
    - priority: -200
      then:
        - lambda: |-
            if (castle_sd::mount(${sd_cs}, ${sd_sck}, ${sd_mosi}, ${sd_miso})) {
              castle_sd::list_root();
              // One line per boot on the card: the season-long paper trail,
              // and since v5.62 (L1) the tail of the PREVIOUS life's event
              // ring underneath it, read out of RTC slow memory. This is the
              // safe window — the card is up, the show has not started — and
              // it stays the only card write outside an upload.
              castle_health::log_boot_to_sd(ESPHOME_PROJECT_VERSION);
            } else {
              // No card, so nothing to dump to: the ring still has to start
              // this life fresh, or the next reset re-dumps a life that is
              // now two boots old.
              castle_health::finish_boot();
            }
        # Which scene ids are real — read off the card's own manifest, so
        # the web layer 404s a name nothing can play instead of queueing a
        # lie. Eleven lines of this lambda until v5.69; a script now
        # (castle_scenes.yaml seed_scene_ids, which carries the whole why),
        # because a publish re-runs it from the 200 ms interval below. No
        # delay in it, so this executes inline — where the braces used to be,
        # which is BEFORE castle_web::start() and still matters (v5.60, A5).
        - script.execute: seed_scene_ids
        - lambda: |-
            // Started whether or not the card mounted: the server is also how
            // you find out the card is missing without walking to the castle.
            castle_web::start();
            // L5 (v5.62): the boot window is over. The capture callback is
            // installed permanently (castle.yaml, priority 800) and used to
            // roll for the whole life of the boot, so the mount, the listing
            // and the manifest check — the ONLY lines nothing else can ever
            // show you — were pushed out by show chatter long before anyone
            // pressed "Dump boot log". Everything after this point is
            // reachable over the API and in /api/events; these lines are not.
            castle_log::freeze();
        # #29: prove every scene file exists BEFORE a cue plays silence.
        - script.execute: manifest_check
        # The opening scene, moved down here from castle.yaml's -100 in v5.67:
        # it reads the card now, so it cannot run before the card is mounted.
        # WHICH scene is the show's first — the manifest's first id, or the
        # first this image was built with when there is no manifest — rather
        # than a name compiled into the core, because the whole point of the
        # change is that the card decides what the show is.
        - script.execute:
            id: run_scene
            scene: !lambda 'return castle_web::first_scene_id();'
        # #26: a visible sweep of every colour channel at plug-in, so a dead
        # channel is a porch-step diagnosis, not a mid-show mystery.
        - script.execute: boot_selftest

# Play a card file by name from the "Play SD file" button — the same
# loopback stream the PLAY action uses (castle_web_actions.yaml,
# sd_web_site.h),
# just reachable without a browser: set the `SD file` text, press the button.
script:
  # #26: boot self-test — every zone flashes R, G, B, W in turn, riding the
  # strike machinery over whatever scene is starting. No tone on purpose:
  # vigil's own opening audio is the speaker test, and a chirp here would
  # stomp it (one announcement pipeline).
  - id: boot_selftest
    then:
      - lambda: |-
          for (int z = 0; z < 3; z++) {
            id(zone_flash_col)[z*4+0] = 1; id(zone_flash_col)[z*4+1] = 0;
            id(zone_flash_col)[z*4+2] = 0; id(zone_flash_col)[z*4+3] = 0;
            id(zone_flash)[z] = 1.0f; id(zone_flash_decay)[z] = 0.86f;
          }
      - delay: 350ms
      - lambda: |-
          for (int z = 0; z < 3; z++) {
            id(zone_flash_col)[z*4+1] = 1; id(zone_flash_col)[z*4+0] = 0;
            id(zone_flash)[z] = 1.0f;
          }
      - delay: 350ms
      - lambda: |-
          for (int z = 0; z < 3; z++) {
            id(zone_flash_col)[z*4+2] = 1; id(zone_flash_col)[z*4+1] = 0;
            id(zone_flash)[z] = 1.0f;
          }
      - delay: 350ms
      - lambda: |-
          for (int z = 0; z < 3; z++) {
            id(zone_flash_col)[z*4+3] = 1; id(zone_flash_col)[z*4+2] = 0;
            id(zone_flash)[z] = 1.0f;
          }

  - id: play_sd
    mode: restart
    parameters:
      path: string
    then:
      - lambda: |-
          // STREAMED off the card through our own server over loopback —
          // identical to what the web PLAY action does (the web_action
          // script, castle_web_actions.yaml).
          // The PSRAM load-then-decode path this once took is gone
          // (sd_audio.h); there is no second way to play a card file.
          // url_encode, because the server at the other end DECODES the
          // path: a raw "a+b.mp3" asked for "a b.mp3" and 404'd for the
          // life of the card (grade report 2026-09-17 J1).
          auto call = id(castle_media)->make_call();
          call.set_media_url("http://127.0.0.1:8080/sd/" +
                             castle_web::url_encode(path));
          call.set_announcement(true);
          call.perform();
          id(current_track).publish_state(path);
          id(cues_begin)->execute(path);

# The bridge between the web server's httpd task and ESPHome's main loop.
# HTTP handlers only *record* play/scene/stop requests (scripts and the media
# player are not thread-safe off the loop); this mirrors live state out to
# them and then picks up whatever they left (`web_action`, in
# castle_web_actions.yaml — one script, run inline from the end of this
# lambda's tick).
# 200 ms of latency on a button press is imperceptible next to an MP3 spin-up.
interval:
  - interval: 200ms
    then:
      - lambda: |-
          // J1 (grade report 2026-09-17 pm): a publish landed a new
          // /sd/scenes/show.man, so the id list is stale. The upload worker
          // runs on its own task and must not open the card's manifest or
          // touch g_scene_ids' vector — it rings a bell (an atomic) and this
          // loop does the reading. exchange(), so the bell is cleared by
          // whichever tick gets it and the re-seed happens once per publish.
          if (castle_web::g_scenes_dirty.exchange(false)) {
            ESP_LOGI("castle", "show.man was republished — re-reading the ids");
            id(seed_scene_ids)->execute();
          }
          // Mirror live state OUT to the web server (its handlers must never
          // read ESPHome objects), then execute anything it queued.
          castle_web::g_volume.store((int) (id(castle_media)->volume * 100.0f + 0.5f));
          castle_web::g_show_on.store(id(show_playlist)->is_running());
          castle_web::g_pir_armed.store(id(pir_armed).state);
          castle_web::g_pir_cooldown.store((int) id(pir_cooldown).state);
          // v5.52: the audio clock. Scenes go out as announcements, so
          // ANNOUNCING is "playing" here. The tick the pipeline goes idle
          // under a raw file (no scene script to clear it) is the tick
          // /api/status stops naming that file — a browser following the
          // castle sees the song end instead of a track that plays forever.
          {
            const auto ms = id(castle_media)->state;
            const bool playing =
                ms == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                ms == media_player::MEDIA_PLAYER_STATE_ANNOUNCING;
            // The speaker's own state is the sound: the pipeline says
            // PLAYING half a second before the amplifier gets a sample.
            const bool sounding = id(castle_speaker)->is_running();
            // L10 (v5.62): the track goes in with it, so the ring's `sound`
            // line names what the amplifier got and its `silent` line says
            // how many milliseconds of it actually played.
            if (castle_web::mirror_audio(playing, sounding, esp_timer_get_time(),
                                         id(current_track).state) &&
                id(current_scene).state == "stop" &&
                !id(current_track).state.empty()) {
              id(current_track).publish_state("");
              // v5.63: a card show ends with its song, and ends DARK — the
              // zones would otherwise hold the last section's look all night.
              if (castle_cues::active()) {
                id(cues_end)->execute();
                id(scene_stop)->execute();
              }
            }
          }
          // pir_scene is a `text` since v5.69, not a `select` — J1: a
          // select's options are compiled in, and the one entity that names
          // which scene motion fires could not learn a published scene
          // without an OTA. `/api/pir` validates the id against the card's
          // own list instead (sd_web.h h_pir).
          castle_web::mirror_show_state(id(current_scene).state,
                                        id(current_track).state,
                                        id(pir_scene).state);
          // The event ring (sd_web_state.h): light frames the one-slot
          // mailbox dropped, at most one line a second, and then one line
          // per command this tick actually runs. RAM only — a card write
          // here would stall the very audio and pixels it describes.
          castle_web::note_light_evictions(esp_timer_get_time());
          // L6 (v5.62): the radio, in the ring and in /api/status. Watched
          // from here rather than from a `wifi: on_connect:` trigger because
          // the wifi block lives in castle.yaml, which is the CORE every
          // build shares — this file is where the web layer exists. One bool
          // compare per tick buys "the castle stopped answering at 21:14",
          // which is a different fault from "the castle crashed".
          if (wifi::global_wifi_component != nullptr)
            castle_web::mirror_wifi(wifi::global_wifi_component->is_connected(),
                                    (int) wifi::global_wifi_component->wifi_rssi(),
                                    esp_timer_get_time());
          // A2: the OTHER image confirmation, beside api: on_client_connected
          // (castle.yaml). A castle with no Home Assistant on the network
          // never gets that client, so a web-OTA'd image stayed in
          // PENDING_VERIFY and the bootloader rolled it back on the next
          // power cycle. One /api/status answered proves the same things a
          // client connect does — WiFi is up and the server that delivers
          // the NEXT update is answering. Cheap no-op after the first call.
          if (castle_web::g_status_served.load())
            castle_sd::mark_firmware_healthy();
      # And then the mailbox: whatever the web server recorded since the
      # last tick, executed on the loop. One script in a package of its
      # own (castle_web_actions.yaml) since v5.70, with no delay in it, so
      # it runs INLINE — here, after the mirror, which is the order the
      # contract cares about.
      - script.execute: web_action

# A card check you can see in Home Assistant without reading logs.
binary_sensor:
  - platform: template
    name: "SD card present"
    lambda: "return castle_sd::g_mounted;"

# ── SD diagnostics, driven remotely ──────────────────────────────────
# The mount and its listing happen at boot priority -200, before the API is
# up, so their log lines are gone by the time anything can read them. The boot
# log ring (boot_log.h) keeps them, and these re-run the checks on demand —
# which is what you want when the card is swapped without a reboot.
button:
  - platform: template
    name: "List SD card"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          if (!castle_sd::g_mounted) {
            ESP_LOGW("castle_sd", "not mounted — mounting now");
            castle_sd::mount(${sd_cs}, ${sd_sck}, ${sd_mosi}, ${sd_miso});
          }
          castle_sd::list_root();

  # A stuck FATFS lock cannot be waited out — see remount() for why. This is
  # the recovery, and pressing it is also the experiment that tells us whether
  # the lock is the fault or the card is.
  - platform: template
    name: "Remount SD"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          castle_sd::remount(${sd_cs}, ${sd_sck}, ${sd_mosi}, ${sd_miso});
          castle_sd::list_root();

  # Plays whatever `SD file` names. Separate from the script so it can be
  # pressed from anywhere that speaks the API, with no YAML edit.
  - platform: template
    name: "Play SD file"
    entity_category: config
    on_press:
      - script.execute:
          id: play_sd
          path: !lambda 'return id(sd_path).state;'

text:
  - platform: template
    name: "SD file"
    id: sd_path
    optimistic: true
    mode: text
    # Relative to the card root: play_sd prefixes /sd/ (the loopback URL).
    initial_value: "test.mp3"
    entity_category: config
