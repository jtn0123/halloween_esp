# GENERATED BY tools/gen_esphome.py — DO NOT EDIT
#
# Source of truth: scenes/scenes.yaml
# Regenerate with:  make generate
#
# The show as a WHOLE: blackout, dispatch by name, the evening playlist. What
# one scene DOES is not here — it is a cue file on the card since v5.67
# (audio/card/scenes/<id>.cue, firmware/castle_scenes.h).


# 3 zones, 26 pixels — one strip each
#   towerL    7 px (chain equivalent 0-6)
#   towerR    7 px (chain equivalent 7-13)
#   door     12 px (chain equivalent 14-25)

script:
  # ── Blackout ─────────────────────────────────────
  - id: scene_stop
    mode: restart
    then:
      - lambda: 'id(zone_effect)[0] = 0; id(zone_center)[0] = -1; id(zone_overlay)[0] = 0; id(zone_flash)[0] = 0.0f; id(zone_flash_target)[0] = 0.0f; id(zone_effect)[1] = 0; id(zone_center)[1] = -1; id(zone_overlay)[1] = 0; id(zone_flash)[1] = 0.0f; id(zone_flash_target)[1] = 0.0f; id(zone_effect)[2] = 0; id(zone_center)[2] = -1; id(zone_overlay)[2] = 0; id(zone_flash)[2] = 0.0f; id(zone_flash_target)[2] = 0.0f;'
      - lambda: |-
          id(scene_run)->stop();
          castle_scenes::stop();
          castle_web::g_cues.store(0);
      - media_player.stop:
      - text_sensor.template.publish:
          id: current_scene
          state: 'stop'
      - text_sensor.template.publish:
          id: current_track
          state: ''

  # ── Dispatch by name ─────────────────────────────
  - id: run_scene
    mode: restart
    parameters:
      scene: string
    then:
      - lambda: |-
          castle_web::record_event(castle_web::EventKind::SCENE_START,
                                   scene, esp_timer_get_time());
          // Stop the runner first. Without this a looping
          // scene's pending re-run fires AFTER the new scene starts
          // and takes the stage back — two loops fighting forever.
          id(scene_run)->stop();
          if (scene != "halt") for (auto *z : {id(zone_towerL), id(zone_towerR), id(zone_door)}) {
            if (!z->remote_values.is_on() ||
                z->get_effect_name() != "Show") {
              id(lights_override)->execute("show"); break; } }
          if (scene == "stop") { id(scene_stop)->execute(); return; }
          if (scene == "halt") { castle_scenes::stop(); return; }
          id(scene_run)->execute(scene);

  # ── The evening playlist (#19) ───────────────────
  - id: show_playlist
    mode: restart
    then:
      - script.execute: {id: run_scene, scene: vigil}
      - delay: !lambda 'return 1500 + castle_scenes::length_ms();'   # vigil
      - script.execute: scene_stop
      - delay: 12000ms
      - script.execute: {id: run_scene, scene: storm}
      - delay: !lambda 'return 1500 + castle_scenes::length_ms();'   # storm
      - script.execute: scene_stop
      - delay: 12000ms
      - script.execute: {id: run_scene, scene: seance}
      - delay: !lambda 'return 1500 + castle_scenes::length_ms();'   # seance
      - script.execute: scene_stop
      - delay: 12000ms
      - script.execute: {id: run_scene, scene: ballroom}
      - delay: !lambda 'return 1500 + castle_scenes::length_ms();'   # ballroom
      - script.execute: scene_stop
      - delay: 12000ms
      - script.execute: {id: run_scene, scene: descent}
      - delay: !lambda 'return 1500 + castle_scenes::length_ms();'   # descent
      - script.execute: scene_stop
      - delay: 12000ms
      - script.execute: {id: run_scene, scene: visitation}
      - delay: !lambda 'return 1500 + castle_scenes::length_ms();'   # visitation
      - script.execute: scene_stop
      - delay: 12000ms
      - script.execute: {id: run_scene, scene: crypt}
      - delay: !lambda 'return 1500 + castle_scenes::length_ms();'   # crypt
      - script.execute: scene_stop
      - delay: 12000ms
      - script.execute: {id: run_scene, scene: the_citizens_of_halloween___this}
      - delay: !lambda 'return 1500 + castle_scenes::length_ms();'   # the_citizens_of_halloween___this
      - script.execute: scene_stop
      - delay: 12000ms
      - script.execute: {id: run_scene, scene: the_ballad_of_the_witches__road_}
      - delay: !lambda 'return 1500 + castle_scenes::length_ms();'   # the_ballad_of_the_witches__road_
      - script.execute: scene_stop
      - delay: 12000ms
      - script.execute: show_playlist

text_sensor:
  - platform: template
    id: current_scene
    name: 'Current scene'
  - platform: template
    id: current_track
    name: 'Current track'

# Motion is configuration, not code: which scene fires, how long the
# lockout is, and whether the sensor is armed at all — all changeable
# from the web panel or Home Assistant, all persisted.
# J1 (grade report 2026-09-17 pm): a TEXT, not a select. A select's
# options are compiled in, so the one entity that names which scene
# motion fires could only learn a newly published scene through an
# OTA — while /api/pir already 404s an id the CARD does not list
# (sd_web.h h_pir, against the same list /api/scene checks). The
# validation lives at that door; this holds whatever it accepted.
text:
  - platform: template
    name: 'PIR scene'
    id: pir_scene
    optimistic: true
    restore_value: true
    mode: text
    # castle_scenes::kIdMax - 1, the longest id a card manifest row
    # can hold; anything longer could not be a scene on the card.
    max_length: 39
    initial_value: approach
number:
  - platform: template
    name: 'PIR cooldown'
    id: pir_cooldown
    optimistic: true
    restore_value: true
    min_value: 5
    max_value: 600
    step: 5
    initial_value: 60
    unit_of_measurement: s
switch:
  - platform: template
    name: 'PIR armed'
    id: pir_armed
    optimistic: true
    # 2026-09-17: the AM312 is not wired on the S3 carrier, so the
    # castle boots DISARMED and a floating pin cannot fire a scene.
    # /api/pir?armed=1 still arms it for the session (and, being
    # optimistic with no restore, only for the session). Put this
    # back to RESTORE_DEFAULT_ON when the sensor is on the board.
    restore_mode: ALWAYS_OFF
