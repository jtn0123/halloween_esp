  # ── Blackout ─────────────────────────────────────
  - id: scene_stop
    mode: restart
    then:
      - lambda: 'id(zone_effect)[0] = 0; id(zone_flash)[0] = 0.0f; id(zone_effect)[1] = 0; id(zone_flash)[1] = 0.0f; id(zone_effect)[2] = 0; id(zone_flash)[2] = 0.0f;'
      - media_player.stop:
      - text_sensor.template.publish:
          id: current_scene
          state: 'stop'
      - text_sensor.template.publish:
          id: current_track
          state: ''

  # ── Dispatch by name ─────────────────────────────
  - id: run_scene
    mode: restart
    parameters:
      scene: string
    then:
      - lambda: |-
          // Stop every scene script first. Without this a looping
          // scene's pending delay re-fires AFTER the new scene starts
          // and takes the stage back — two loops fighting forever.
          id(scene_vigil)->stop();
          id(scene_storm)->stop();
          id(scene_seance)->stop();
          id(scene_ballroom)->stop();
          id(scene_descent)->stop();
          id(scene_visitation)->stop();
          id(scene_approach)->stop();
          id(scene_crypt)->stop();
          if (scene == "vigil") id(scene_vigil)->execute();
          else if (scene == "storm") id(scene_storm)->execute();
          else if (scene == "seance") id(scene_seance)->execute();
          else if (scene == "ballroom") id(scene_ballroom)->execute();
          else if (scene == "descent") id(scene_descent)->execute();
          else if (scene == "visitation") id(scene_visitation)->execute();
          else if (scene == "approach") id(scene_approach)->execute();
          else if (scene == "crypt") id(scene_crypt)->execute();
          else if (scene == "stop") id(scene_stop)->execute();
          else ESP_LOGW("castle", "unknown scene '%s'", scene.c_str());

text_sensor:
  - platform: template
    id: current_scene
    name: 'Current scene'
  - platform: template
    id: current_track
    name: 'Current track'

# Motion is configuration, not code: which scene fires, how long the
# lockout is, and whether the sensor is armed at all — all changeable
# from the web panel or Home Assistant, all persisted.
select:
  - platform: template
    name: 'PIR scene'
    id: pir_scene
    optimistic: true
    restore_value: true
    options: [vigil, storm, seance, ballroom, descent, visitation, approach, crypt, stop]
    initial_option: approach
number:
  - platform: template
    name: 'PIR cooldown'
    id: pir_cooldown
    optimistic: true
    restore_value: true
    min_value: 5
    max_value: 600
    step: 5
    initial_value: 60
    unit_of_measurement: s
switch:
  - platform: template
    name: 'PIR armed'
    id: pir_armed
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
