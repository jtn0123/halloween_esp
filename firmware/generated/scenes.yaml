      - script.execute: {id: run_scene, scene: the_citizens_of_halloween___this}
      - delay: 193360ms
      - script.execute: scene_stop
      - delay: 12000ms
      - script.execute: show_playlist

text_sensor:
  - platform: template
    id: current_scene
    name: 'Current scene'
  - platform: template
    id: current_track
    name: 'Current track'

# Motion is configuration, not code: which scene fires, how long the
# lockout is, and whether the sensor is armed at all — all changeable
# from the web panel or Home Assistant, all persisted.
select:
  - platform: template
    name: 'PIR scene'
    id: pir_scene
    optimistic: true
    restore_value: true
    options: [vigil, storm, seance, ballroom, descent, visitation, approach, crypt, the_citizens_of_halloween___this, stop]
    initial_option: approach
number:
  - platform: template
    name: 'PIR cooldown'
    id: pir_cooldown
    optimistic: true
    restore_value: true
    min_value: 5
    max_value: 600
    step: 5
    initial_value: 60
    unit_of_measurement: s
switch:
  - platform: template
    name: 'PIR armed'
    id: pir_armed
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
