      - lambda: 'id(zone_flash)[2] = 0.370f; id(zone_flash_target)[2] = 0.0f; id(zone_flash_decay)[2] = 0.8711f; id(zone_flash_mode)[2] = 1; id(zone_flash_epoch)[2] = (id(zone_flash_epoch)[2] + 1) % 1000; id(zone_flash_col)[8] = 1.00f; id(zone_flash_col)[9] = 0.30f; id(zone_flash_col)[10] = 0.01f; id(zone_flash_col)[11] = 0.04f;'    # onset_low
      - lambda: 'id(zone_flash_target)[1] = 0.122f; id(zone_flash_rise)[1] = 0.0217f; id(zone_flash_decay)[1] = 0.9312f; id(zone_flash_mode)[1] = 2; id(zone_flash_epoch)[1] = (id(zone_flash_epoch)[1] + 1) % 1000; id(zone_flash_col)[4] = 0.69f; id(zone_flash_col)[5] = 0.05f; id(zone_flash_col)[6] = 0.95f; id(zone_flash_col)[7] = 0.04f;'    # onset_mid
      - delay: 720ms
      - lambda: 'id(zone_flash)[2] = 0.338f; id(zone_flash_target)[2] = 0.0f; id(zone_flash_decay)[2] = 0.8711f; id(zone_flash_mode)[2] = 2; id(zone_flash_epoch)[2] = (id(zone_flash_epoch)[2] + 1) % 1000; id(zone_flash_col)[8] = 0.91f; id(zone_flash_col)[9] = 0.18f; id(zone_flash_col)[10] = 0.16f; id(zone_flash_col)[11] = 0.04f;'    # onset_low
      - delay: 429ms
      - lambda: 'id(zone_flash_target)[1] = 0.124f; id(zone_flash_rise)[1] = 0.0220f; id(zone_flash_decay)[1] = 0.9312f; id(zone_flash_mode)[1] = 2; id(zone_flash_epoch)[1] = (id(zone_flash_epoch)[1] + 1) % 1000; id(zone_flash_col)[4] = 1.00f; id(zone_flash_col)[5] = 0.05f; id(zone_flash_col)[6] = 0.78f; id(zone_flash_col)[7] = 0.04f;'    # onset_mid
      - delay: 1033ms
      - lambda: 'id(zone_flash)[2] = 0.237f; id(zone_flash_target)[2] = 0.0f; id(zone_flash_decay)[2] = 0.8711f; id(zone_flash_mode)[2] = 2; id(zone_flash_epoch)[2] = (id(zone_flash_epoch)[2] + 1) % 1000; id(zone_flash_col)[8] = 1.00f; id(zone_flash_col)[9] = 0.15f; id(zone_flash_col)[10] = 0.01f; id(zone_flash_col)[11] = 0.03f;'    # onset_low
      - delay: 221ms
      - lambda: 'id(zone_flash)[2] = 0.221f; id(zone_flash_target)[2] = 0.0f; id(zone_flash_decay)[2] = 0.8711f; id(zone_flash_mode)[2] = 2; id(zone_flash_epoch)[2] = (id(zone_flash_epoch)[2] + 1) % 1000; id(zone_flash_col)[8] = 1.00f; id(zone_flash_col)[9] = 0.25f; id(zone_flash_col)[10] = 0.01f; id(zone_flash_col)[11] = 0.03f;'    # onset_low
      - delay: 785ms
      - lambda: 'id(zone_effect)[0] = 9; id(zone_level)[0] = 0.06f;'    # silence
      - lambda: 'id(zone_effect)[1] = 9; id(zone_level)[1] = 0.06f;'    # silence
      - lambda: 'id(zone_effect)[2] = 2; id(zone_level)[2] = 0.08f;'    # silence
      - delay: 4610ms
      - script.execute: scene_the_citizens_of_halloween___this

  # ── Blackout ─────────────────────────────────────
  - id: scene_stop
    mode: restart
    then:
      - lambda: 'id(zone_effect)[0] = 0; id(zone_flash)[0] = 0.0f; id(zone_effect)[1] = 0; id(zone_flash)[1] = 0.0f; id(zone_effect)[2] = 0; id(zone_flash)[2] = 0.0f;'
      - media_player.stop:
      - text_sensor.template.publish:
          id: current_scene
          state: 'stop'
      - text_sensor.template.publish:
          id: current_track
          state: ''

  # ── Dispatch by name ─────────────────────────────
  - id: run_scene
    mode: restart
    parameters:
      scene: string
    then:
      - lambda: |-
          // Stop every scene script first. Without this a looping
          // scene's pending delay re-fires AFTER the new scene starts
          // and takes the stage back — two loops fighting forever.
          id(scene_vigil)->stop();
          id(scene_storm)->stop();
          id(scene_seance)->stop();
          id(scene_ballroom)->stop();
          id(scene_descent)->stop();
          id(scene_visitation)->stop();
          id(scene_approach)->stop();
          id(scene_crypt)->stop();
          id(scene_the_citizens_of_halloween___this)->stop();
          if (scene == "vigil") id(scene_vigil)->execute();
          else if (scene == "storm") id(scene_storm)->execute();
          else if (scene == "seance") id(scene_seance)->execute();
          else if (scene == "ballroom") id(scene_ballroom)->execute();
          else if (scene == "descent") id(scene_descent)->execute();
          else if (scene == "visitation") id(scene_visitation)->execute();
          else if (scene == "approach") id(scene_approach)->execute();
          else if (scene == "crypt") id(scene_crypt)->execute();
          else if (scene == "the_citizens_of_halloween___this") id(scene_the_citizens_of_halloween___this)->execute();
          else if (scene == "stop") id(scene_stop)->execute();
          else ESP_LOGW("castle", "unknown scene '%s'", scene.c_str());

  # ── The evening playlist (#19) ───────────────────
  - id: show_playlist
    mode: restart
    then:
      - script.execute: {id: run_scene, scene: vigil}
      - delay: 30000ms
      - script.execute: scene_stop
      - delay: 12000ms
      - script.execute: {id: run_scene, scene: storm}
      - delay: 6500ms
      - script.execute: scene_stop
      - delay: 12000ms
      - script.execute: {id: run_scene, scene: seance}
      - delay: 35000ms
      - script.execute: scene_stop
      - delay: 12000ms
      - script.execute: {id: run_scene, scene: ballroom}
      - delay: 15000ms
      - script.execute: scene_stop
      - delay: 12000ms
      - script.execute: {id: run_scene, scene: descent}
      - delay: 27000ms
      - script.execute: scene_stop
      - delay: 12000ms
      - script.execute: {id: run_scene, scene: visitation}
      - delay: 11000ms
      - script.execute: scene_stop
      - delay: 12000ms
      - script.execute: {id: run_scene, scene: crypt}
      - delay: 24000ms
      - script.execute: scene_stop
      - delay: 12000ms
      - script.execute: {id: run_scene, scene: the_citizens_of_halloween___this}
      - delay: 193360ms
      - script.execute: scene_stop
      - delay: 12000ms
      - script.execute: show_playlist

text_sensor:
  - platform: template
    id: current_scene
    name: 'Current scene'
  - platform: template
    id: current_track
    name: 'Current track'

# Motion is configuration, not code: which scene fires, how long the
# lockout is, and whether the sensor is armed at all — all changeable
# from the web panel or Home Assistant, all persisted.
select:
  - platform: template
    name: 'PIR scene'
    id: pir_scene
    optimistic: true
    restore_value: true
    options: [vigil, storm, seance, ballroom, descent, visitation, approach, crypt, the_citizens_of_halloween___this, stop]
    initial_option: approach
number:
  - platform: template
    name: 'PIR cooldown'
    id: pir_cooldown
    optimistic: true
    restore_value: true
    min_value: 5
    max_value: 600
    step: 5
    initial_value: 60
    unit_of_measurement: s
switch:
  - platform: template
    name: 'PIR armed'
    id: pir_armed
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
