# GENERATED BY tools/gen_esphome.py — DO NOT EDIT
#
# Source of truth: scenes/scenes.yaml (the `zones:` block)
# Regenerate with:  make generate
#
# One strip per zone. Pin, count and colour type all come from the
# zone's own entry; substitutions let bench.yaml point a zone at the
# onboard pixel without editing this file.
light:
  - platform: esp32_rmt_led_strip
    id: zone_towerL
    name: "Castle towerL"
    pin: GPIO${pin_towerL}
    num_leds: ${px_towerL}
    chipset: WS2812
    rgb_order: GRB
    is_rgbw: ${rgbw_towerL}
    rmt_symbols: 64
    use_psram: false
    default_transition_length: 0s
    effects:
      - addressable_lambda:
          name: "Show"
          update_interval: 16ms
          lambda: |-
            using namespace castle;
            const Fixture &fx = RIG[0];
            static uint8_t buf[RIG_MAX_PIXELS * 4];
            ZoneIo io{
                &id(zone_flash)[0], &id(zone_flash_target)[0],
                &id(zone_flash_rise)[0], id(zone_flash_decay)[0],
                &id(zone_flash_col)[0],
                id(zone_level)[0], id(zone_phase)[0],
                (float) id(trim_towerl).state,
                (float) id(hue_balance).state,
                id(zone_effect)[0], id(zone_center)[0],
                id(zone_overlay)[0], id(zone_palette)[0],
                id(zone_flash_mode)[0], id(zone_flash_epoch)[0],
                id(soften).state};
            step_flash(io);
            render_zone(buf, 0, fx, millis() / 1000.0f, io);
            for (int p = 0; p < fx.n; p++)
              it[p] = Color(buf[p * 4], buf[p * 4 + 1],
                            buf[p * 4 + 2], buf[p * 4 + 3]);
      - addressable_lambda:
          name: "Test Bars"
          update_interval: 500ms
          lambda: |-
            // Red, green, blue repeating. Wrong first colour means
            // rgb_order is wrong; a gap means a dead pixel; count the
            // triplets to see how many pixels actually arrive.
            for (int p = 0; p < it.size(); p++) {
              const int k = p % 3;
              it[p] = Color(k == 0 ? 255 : 0, k == 1 ? 255 : 0,
                            k == 2 ? 255 : 0, 0);
            }
      - addressable_lambda:
          name: "Test Chase"
          update_interval: 100ms
          lambda: |-
            // One white dot walking the chain, ~4 px/s. Where it stops
            // is where the data stops: a cut wire, a cold joint, or the
            // pixel that died. It wraps, so watch one full lap.
            const int n = it.size() > 0 ? it.size() : 1;
            const int at = (millis() / 250) % n;
            for (int p = 0; p < it.size(); p++)
              it[p] = p == at ? Color(255, 255, 255, 255) : Color(0, 0, 0, 0);
      - addressable_lambda:
          name: "Test Ends"
          update_interval: 500ms
          lambda: |-
            // First pixel red, last blue, the rest dim. Which end lights
            // red is the end the data goes in — the answer when a jewel
            // is mounted upside down and the centre pixel looks wrong.
            for (int p = 0; p < it.size(); p++)
              it[p] = Color(24, 24, 24, 0);
            if (it.size() > 0) it[0] = Color(255, 0, 0, 0);
            if (it.size() > 1) it[it.size() - 1] = Color(0, 0, 255, 0);
