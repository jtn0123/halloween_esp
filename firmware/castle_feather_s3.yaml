# THE castle: an Adafruit ESP32-S3 Feather #5477 in the castle-carrier v3.3a.
#
#   make build         compile it
#   make upload        flash it over the Feather's USB-C
#   make logs          tail its logs over the same cable
#   make ota           build, stop audio, flash it over HTTP
#
# This is the build in the yard. It has been on hardware since 2026-09-17:
# v5.64 went on over Wi-Fi, the panel answered at 10.27.27.81, RAM measured
# 41.9% (143,035 of 341,760) and flash 71.8% of the 1,835,008-byte OTA slot.
# Before that date the porch ran an ESP32-S2 Feather and THIS file was the
# third of three builds, written as "the S2 build with the chip swapped". The
# S2 was retired the same day — docs/notes/03-build.md §12.20 records the
# decision, and firmware/pending/README.md carries the version history.
#
# NOT #5323. That Feather is 8 MB of flash and NO PSRAM, and castle.yaml's
# `psram:` block — which the show's audio buffers live in — would find
# nothing. If that is the board in hand, this file needs a no-PSRAM decision
# first, not a board-string swap.
#
# WHAT IS LEFT HERE, now that castle.yaml describes this chip:
#
#   1. the Feather's own NeoPixel on GPIO33, behind its GPIO21 power rail,
#      and the 2 s interval that writes DEVICE STATUS to it
#   2. the playback codecs
#
# and nothing else. Every GPIO, the console, the RMT block size and the flash
# layout are castle.yaml's, because they are this board's. The other build —
# castle_s3.yaml, the bare-WROOM carrier v5 — is the one that now writes over
# them, and it is the one that has never been on hardware.
#
# No `i2c:` here: v3.3a leaves SDA/SCL unconnected. The carrier build has an
# INA219 and therefore has the block.

substitutions:
  name: castle-feather-s3
  friendly: Castle Feather S3

packages:
  base: !include castle.yaml
  # The card, the loopback stream, the web server and its bridge — every
  # line of the show that does not care which chip is running it. The carrier
  # build includes this same file.
  sd: !include castle_sd_common.yaml

# Keep the playback choices on THIS build rather than in castle.yaml: the
# carrier build compiles weekly with no board to flash, and it should not
# start paying a flash cost for decoders nobody has asked it to prove. The
# pipeline still prefers MP3, while SD URLs select their decoder from the
# file. FLAC is deliberately excluded.
audio:
  codecs:
    mp3:
    opus:
    wav:

esphome:
  on_boot:
    # -190, so this lands BEFORE the card mount at -200: "I just rebooted",
    # in one pixel, is meant to be the first thing written to the onboard
    # NeoPixel — it clears the garbage the LED wakes up holding. The 2 s
    # status interval below turns it off a moment later if all is well.
    - priority: -190
      then:
        - light.turn_on:
            id: status_pixel
            brightness: 25%
            red: 0%
            green: 20%
            blue: 100%

# The onboard pixel is dark until its power rail (GPIO21) is driven high —
# same as bench.yaml. The rail stays on so the status pixel below can write.
# `NEOPIXEL_POWER 21` in both Feathers' pins_arduino.h, which is why this
# survived the chip swap untouched.
switch:
  - platform: gpio
    id: neopixel_power
    pin: GPIO21
    restore_mode: ALWAYS_ON
    internal: true

# ── The onboard NeoPixel: DEVICE STATUS ONLY ─────────────────────────
# Appended to the generated strips (packages merge lists by appending), so it
# is allocated an RMT channel LAST and can never take one the show needs.
# It has no zone in scenes.yaml, which is what keeps it out of the show: no
# scene script and no /api/light can address it. Between status changes it is
# written once and then silent, so it costs the strips nothing.
#
# Until v5.31 this pixel WAS tower L (a bench leftover); with that gone and
# the rail still powered, it sat holding whatever garbage it woke up with.
light:
  - platform: esp32_rmt_led_strip
    id: status_pixel
    name: "Status pixel"
    pin: GPIO33
    num_leds: 1
    chipset: WS2812
    channel_colors: GRB
    # One S3 TX channel block — the fourth and last. tools/gen_rig.py is TOLD
    # about this line (STATUS_PIXEL_BLOCKS) so its budget banner counts it:
    # three strips at 48 plus this one is 192 of 192, every TX channel the S3
    # has, spent. A strip that asks for a block that is already gone gets no
    # channel and stays dark without a word.
    rmt_symbols: 48
    use_psram: false
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

interval:
  - interval: 2s
    then:
      - lambda: |-
          // The status pixel: blue while booting (written in on_boot, cleared
          // here once there is nothing to say), amber while an OTA burns
          // flash, red for a missing card, dark otherwise. Only a CHANGE
          // writes, so the RMT channel is idle between events.
          static uint8_t shown = 0xFF;
          const uint8_t want = castle_sd::g_quiesce ? 1
                             : (castle_sd::g_mounted ? 0 : 2);
          if (want != shown) {
            shown = want;
            if (want == 0) {
              id(status_pixel).turn_off().perform();
            } else {
              auto call = id(status_pixel).turn_on();
              call.set_brightness(0.25f);
              if (want == 1) call.set_rgb(1.0f, 0.55f, 0.0f);   // updating
              else call.set_rgb(1.0f, 0.0f, 0.0f);              // no card
              call.perform();
            }
          }
