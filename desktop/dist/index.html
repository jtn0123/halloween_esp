<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Castle Tools</title>
  <link rel="stylesheet" href="splash.css">
  <script src="splash.js" defer></script>
</head>
<body>
  <main>
    <div class="rook" aria-hidden="true">&#9820;</div>
    <h1>Castle Tools</h1>
    <output id="message" aria-live="polite">Starting Castle Radio&hellip;</output>
    <div id="spinner" class="spinner" aria-hidden="true"></div>
    <div class="actions">
      <button id="retry" type="button" hidden>Try again</button>
      <button id="log" type="button">Open log</button>
    </div>
    <output id="desk" class="hint"></output>
    <p class="hint">Closing this window keeps Castle Tools in the &#9820; menu. Quit from there.</p>
    <p id="version" class="hint"></p>
  </main>
</body>
</html>
