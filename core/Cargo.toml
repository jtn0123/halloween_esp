# castle-core — the show's arithmetic, one implementation (typesafe plan, B1).
# Zero dependencies on purpose: everything here must compile to a small WASM
# module for the cue desk and stay auditable against the C++/TS copies it
# will eventually replace.
[package]
name = "castle-core"
version = "0.1.0"
# 2024, taken with the feature split (grade report 2026-09-01 F4/A1) now the
# Track-B port has settled. `cargo fix --edition` wrote all of it: `no_mangle`
# and `extern "C"` blocks say `unsafe` out loud, and `env::remove_var` is the
# unsafe call it always was. 1.88 (below) is well past 1.85, where the edition
# stabilised, so the floor does not move.
edition = "2024"
# The floor, next to the exact pin in rust-toolchain.toml: the toolchain file
# says what CI and this machine use, this says what the crate needs, so a
# clone built with someone else's rustup default fails with a version message
# instead of a syntax error. (grade report F3)
rust-version = "1.88"

[lib]
name = "castle_core"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

# The crate's two halves (grade report 2026-09-01 A1). `native` is on by
# default, so every ordinary `cargo build/test/clippy` sees the whole crate
# and nothing about the show's path changes. The desk's cdylib is the one
# caller that turns it off — `--no-default-features` — and gets only the
# arithmetic: no HTTP server, no ffmpeg, no flock, and none of the wasm32
# stubs those used to need to compile for a target that cannot run them.
[features]
default = ["native"]
native = []

# The desk inlines the wasm as base64; every KB here is ~1.4 KB of page.
#
# No `panic = "abort"` here, deliberately (grade report E1). The studio bin
# only ever builds in release (tools/core_bins.py), and it is thread-per-
# connection behind a catch_unwind that promises "never a dead socket" — with
# abort, one handler panic SIGABRTs the whole process and every in-flight
# connection with it, where the Python twin would have degraded gracefully.
# The wasm face loses nothing: wasm32 aborts on panic regardless of profile.
[profile.release]
opt-level = "s"
lto = true
strip = true

# All eight, declared rather than autodiscovered: half of them used to
# exist only because src/bin/ was scanned, so the manifest was not the
# list of bins and `tools/core_bins.py` named four the file did not
# (grade report 2026-09-01 A3). Adding a bin means adding a block.
[[bin]]
name = "castle"
path = "src/bin/castle.rs"
required-features = ["native"]

[[bin]]
name = "scene_render"
path = "src/bin/scene_render.rs"
required-features = ["native"]

[[bin]]
name = "analyze_track"
path = "src/bin/analyze_track.rs"
required-features = ["native"]

[[bin]]
name = "studio"
path = "src/bin/studio.rs"
required-features = ["native"]

[[bin]]
name = "parity_dump"
path = "src/bin/parity_dump.rs"
required-features = ["native"]

[[bin]]
name = "synth_dump"
path = "src/bin/synth_dump.rs"
required-features = ["native"]

[[bin]]
name = "pulse_dump"
path = "src/bin/pulse_dump.rs"
required-features = ["native"]

[[bin]]
name = "netguard_dump"
path = "src/bin/netguard_dump.rs"
required-features = ["native"]
