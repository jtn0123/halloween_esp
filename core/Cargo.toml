# castle-core — the show's arithmetic, one implementation (typesafe plan, B1).
# Zero dependencies on purpose: everything here must compile to a small WASM
# module for the cue desk and stay auditable against the C++/TS copies it
# will eventually replace.
[package]
name = "castle-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "castle_core"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

# The desk inlines the wasm as base64; every KB here is ~1.4 KB of page.
[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[[bin]]
name = "castle"
path = "src/bin/castle.rs"

[[bin]]
name = "parity_dump"
path = "src/bin/parity_dump.rs"

[[bin]]
name = "synth_dump"
path = "src/bin/synth_dump.rs"
