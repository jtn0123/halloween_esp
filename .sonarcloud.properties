# SonarQube Cloud automatic analysis — what is source and what is output.
#
# Generated files are excluded, for the same reason tools/check_loc.py exempts
# them: nothing in them can be fixed. They are overwritten wholesale by their
# generator, so a finding there is either a finding about the generator or
# about the source it inlined, and both of those are analysed on their own.
#
# The one that actually bites is duplication. previewer/castle-cue-desk.html is
# the single-file desk `tools/gen_previewer.py` builds by inlining
# previewer/styles.css, panels.css, mobile.css, template.html and the esbuild
# bundle — that "one self-contained file" constraint is what makes the page
# servable by a microcontroller (firmware/sd_web_site.h). So every line of CSS
# or markup in a change necessarily appears twice: once where it was written,
# once in the build. Measured on the v3 desk PR, 45% of the artifact's changed
# lines were verbatim copies of its own sources, which alone put the pull
# request at 16.4% duplication against a 3% gate.
#
# Excluding it costs no coverage. Every line it contains comes from a file
# Sonar still reads, so this counts that code once instead of twice.
sonar.exclusions=previewer/castle-cue-desk.html,firmware/generated/**
