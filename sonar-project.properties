# SonarQube Cloud, CI-based (.github/workflows/sonar.yml) — what is source, what
# is a test, what is output, and where the coverage reports are. This file was
# .sonarcloud.properties while the project ran automatic analysis; that mode
# cannot import coverage, which is why it went (2026-09-18).
sonar.projectKey=jtn0123_halloween_esp
sonar.organization=jtn0123ismysonar
sonar.sources=.
sonar.tests=.
#
# Generated files are excluded, for the same reason tools/check_loc.py exempts
# them: nothing in them can be fixed. They are overwritten wholesale by their
# generator, so a finding there is either a finding about the generator or
# about the source it inlined, and both of those are analysed on their own.
#
# The one that actually bites is duplication. previewer/castle-cue-desk.html is
# the single-file desk `tools/gen_previewer.py` builds by inlining
# previewer/styles.css, panels.css, mobile.css, template.html and the esbuild
# bundle — that "one self-contained file" constraint is what makes the page
# servable by a microcontroller (firmware/sd_web_site.h). So every line of CSS
# or markup in a change necessarily appears twice: once where it was written,
# once in the build. Measured on the v3 desk PR, 45% of the artifact's changed
# lines were verbatim copies of its own sources, which alone put the pull
# request at 16.4% duplication against a 3% gate.
#
# Excluding it costs no coverage. Every line it contains comes from a file
# Sonar still reads, so this counts that code once instead of twice.
sonar.exclusions=previewer/castle-cue-desk.html,firmware/generated/**
# Test code is analysed as tests, not sources. The organisation has a 50 000
# line cap across projects and the analysis of main has failed since
# 2026-08-27 because this repo's 45 000 counted lines no longer fit next to
# the others; 24 000 of those are tests, which the cap does not count once
# they are declared as such. Same rules run on them, same findings appear.
# (Automatic analysis ignored sonar.sources / sonar.tests and honoured only the
# glob form below; the scanner honours both, and the glob is what splits them.)
sonar.test.inclusions=tests/**,web/test/**,demo/castle-radio/test_*.py,demo/castle-radio/test_*.mjs,demo/castle-radio/*.test.mjs,demo/castle-radio/test_support.mjs
# The analyser otherwise assumes the latest C++ and asks for
# std::ranges / std::format. The board and the host harness compile these
# headers as C++17 (`-std=c++17` in tests/firmware_web_harness.py).
sonar.cfamily.reportingCppStandardOverride=c++17
# Coverage. coverage.py measures tools/ and demo/castle-radio; cargo llvm-cov
# measures core/. Nothing measures the browser code (its suites run esbuild
# bundles and vm-evaluated text), the firmware headers (host harness, no
# gcov), the scripts, or core/src/bin (the bins are exercised as
# subprocesses by tests/test_*_rust.py, which llvm-cov's `cargo test` run
# never sees) — so they are out of the coverage DENOMINATOR here
# instead of being reported as 0% and burying the numbers that are real.
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.rust.cargo.manifestPaths=core/Cargo.toml
sonar.rust.lcov.reportPaths=core/lcov.info
sonar.coverage.exclusions=web/**,previewer/**,firmware/**,demo/castle-radio/**/*.js,demo/castle-radio/**/*.mjs,demo/castle-radio/**/*.swift,**/*.sh,**/*.command,docs/**,core/src/bin/**
