# Lint and type-check config for the Python half. The TS half has its own
# strictness in web/tsconfig.json; this brings tools/ and tests/ up to the
# same standard. Run both with `make lint` (wired into `make check` and CI).

# Not a distributable package — [project] exists to state the interpreter
# floor (grade report F5): the venv is 3.13, CI is 3.13, and the Makefile's
# bare-python3 fallback checks this before running anything.
[project]
name = "halloween-castle"
version = "0"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# The families the 2026-08 baseline was measured against — pyflakes, the
# pycodestyle error classes, import order, and the bug-shaped rule packs.
# Deliberately not the full alphabet: style-only packs would bury the
# signal this exists to surface (silent subprocess failures, mutable
# defaults, dead noqa comments).
select = [
    "E4", "E7", "E9",  # pycodestyle errors (imports, statements, runtime)
    "F",               # pyflakes: unused imports/vars, redefinitions
    "I",               # import order
    "RUF",             # ruff's own: stale noqa, mutable class defaults
    "PLW",             # pylint warnings: subprocess-run-without-check
    "PERF",            # performance smells
    "DTZ",             # naive datetime use
    "ISC",             # implicit string concatenation traps
    "FURB",            # modernisation with behaviour-preserving fixes
    "EXE",             # shebang/executable-bit agreement
]

[tool.ruff.lint.per-file-ignores]
# Every test bootstraps sys.path before importing tools/ — the imports HAVE
# to follow the insert. Saying so once here beats 78 identical noqa comments.
"tests/*" = ["E402"]

[tool.ruff.format]
# The 2026-08 format pass: formatting expanded these six past the 500-line
# cap (they were already on check_loc's nearing-the-cap watchlist, so the
# expansion just moved up a split that was coming anyway). Each one gets
# split on a real seam, formatted in that same pass, and removed from this
# list — the list only ever shrinks.
exclude = [
    "tools/castle_fuzz.py",
    "tools/import_track.py",
    "tools/gen_wiring_diagram.py",
    "tests/test_gen_esphome.py",
    "tests/test_generator_parity.py",
    "tests/test_studio_api.py",
]

[tool.mypy]
python_version = "3.13"
files = ["tools", "tests"]
# Default mypy skips the bodies of unannotated functions, which is most of
# tools/. These three are the cheap half of strictness: check every body,
# refuse an Any leaking out through a typed return, and drop ignores that
# no longer ignore anything. disallow_untyped_defs is the next step, per
# module, once the bodies are clean.
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
# The analysis/synth stack sits on scipy (no stubs shipped) and the device
# tools on esphome's transitive deps; missing stubs there are noise, not
# signal.
[[tool.mypy.overrides]]
module = ["scipy.*", "aioesphomeapi.*", "PIL.*", "esphome.*", "segno.*"]
ignore_missing_imports = true

# The strict ratchet (typesafe-migration-plan A3): modules join this list one
# loop pass at a time, easy to hard, stays-list first — and never leave. The
# per-module-legal half of --strict; warn_redundant_casts is global-only.
[[tool.mypy.overrides]]
module = ["netguard", "check_loc", "build_paths", "manifest", "hosts", "scene_schema", "rig_layout", "gen_rig", "gen_show",
    "gen_esphome_audio", "gen_qr", "gen_eink_font",
    "import_track", "import_fetch", "import_scene",
    "castle_emu_wire", "castle_emu", "castle_emu_http", "gen_esphome", "gen_previewer"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

