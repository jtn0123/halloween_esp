# Halloween Castle — scene definitions
#
# THIS FILE IS THE SOURCE OF TRUTH. Three things are generated from it:
#   tools/render_audio.py  -> audio/NN_<id>.mp3   (one pre-rendered mix per scene)
#   tools/gen_esphome.py   -> firmware/generated/ (light cue scripts)
#   tools/gen_previewer.py -> previewer/          (scene data + audio spliced in)
#
# Why pre-rendered audio: the MAX98357A plays one stream, and mixing/ducking on
# a single-core ESP32-S2 is not worth fighting. Rendering offline means real
# mixing, reverb and crossfades, and the firmware just plays a file.

hardware:
  board: adafruit_feather_esp32s2
  # The FALLBACK pixel count, used by any zone that does not declare its own
  # `fixture:` below. Every zone currently inherits it — three NeoPixel
  # Jewels, 7 RGBW pixels each.
  pixels_per_zone: 7
  rgbw: true
  # Adafruit 8mm through-hole NeoPixels are RGB order, not GRB. Jewels are GRB.
  rgb_order: GRB
  audio:
    sample_rate: 44100
    # 32 kbps is TEMPORARY and it is a real quality loss from the 96 kbps
    # this show was tuned at. It buys OTA: the image has to fit one 1.75 MB
    # app slot, and audio is the only part big enough to matter.
    #
    # The trade is worth making once, because it is the last change that
    # needs someone standing at the board. Once OTA works, moving the audio
    # to the SD card frees ~600 KB and 96 kbps comes back — over the air.
    bitrate: 32
    channels: 1

# The all-evening playlist (#19): "start show" runs these in order, each for
# its full length, with a dark ambient gap between, looping until stopped.
# Omit `order:` to play every scene except motion-triggered ones (the PIR
# owns those) in file order.
show:
  gap_ms: 12000

# One strip per zone, not one chain: an RGBW fixture and an RGB one cannot
# share a data line (32 bits per pixel against 24). docs/WIRING.md §1.
#
# A zone may name what is physically in it, which overrides pixels_per_zone:
#
#   - {id: door, channel: 3, name: "...", pin: 16, fixture: ring16,
#      pixels: 16, rgbw: false}
#
#   pin      GPIO carrying this zone's data. docs/WIRING.md §2.
#   fixture  jewel7 | stick8 | ring12 | ring16 | wing32 | mini | none.
#            Sets the geometry an overlay travels across — see
#            tools/rig_layout.py, which bakes it into generated/rig.h.
#   pixels   scatter fixtures only (`mini`); the rest know their own count.
#   rgbw     whether this fixture has a white die. wing32 and mini never do.
#
# Do not hand-edit these to guess. The Rig panel in the cue desk previews a
# change first and then emits this block along with the matching firmware
# substitutions — which have to move together, or the cues aim at pixels the
# strip does not have.
zones:
  - {id: towerL, channel: 1, name: "Tower window, stage left",
     pin: 18, fixture: jewel7, rgbw: true}
  - {id: towerR, channel: 2, name: "Tower window, stage right",
     pin: 14, fixture: jewel7, rgbw: true}
  - {id: door,   channel: 3, name: "Doorway, centre",
     pin: 16, fixture: ring12, rgbw: false}

# Palette poles the mansion effects crossfade between.
palette:
  violet: [0.66, 0.08, 1.00]
  green:  [0.14, 1.00, 0.42]
  flame:  [1.00, 0.42, 0.09]

scenes:
  - id: vigil
    name: Vigil
    kind: ambient
    volume: 0.45
    duration_ms: 30000
    loop: true
    blurb: >
      Resting state. Candles breathe in both towers, the doorway holds a low
      ember, wind runs underneath.
    base: {towerL: candle, towerR: candle, door: ember}
    zones:
      towerL: {center: ember}
      towerR: {center: ember, phase: 1.7}
      door: {overlay: sparkle}
    score:
      - {t: 0, synth: wind, dur: 30.0, gain: 0.9}
    cues: []

  - id: storm
    name: Storm
    kind: triggered
    volume: 1.0
    duration_ms: 6500
    blurb: >
      Thunder is scheduled first; the strike lands 80 ms behind it. Light beats
      sound to an observer in the real world, so leading with audio is
      physically right.
    base: {towerL: candle, towerR: candle, door: ember}
    score:
      - {t: 0.0, synth: wind,    dur: 6.5, gain: 0.6}
      - {t: 0.0, synth: thunder, gain: 1.0}
    cues:
      - {t: 80,   op: strike, ms: 70,  pixels: scatter, note: "lightning — strike"}
      - {t: 240,  op: strike, ms: 45,  pixels: scatter, note: "stutter"}
      - {t: 355,  op: strike, ms: 120, pixels: scatter, note: "stutter"}
      - {t: 1400, op: strike, zone: towerL, ms: 50, note: "roll — left"}
      - {t: 1490, op: strike, zone: door,   ms: 50, note: "roll — centre"}
      - {t: 1580, op: strike, zone: towerR, ms: 50, note: "roll — right"}
      - {t: 2600, op: strike, ms: 55,  note: "distant"}
      - {t: 4100, op: strike, zone: towerR, ms: 40, note: "far off"}

  - id: seance
    name: Séance
    kind: ambient
    volume: 0.6
    duration_ms: 35000
    loop: true
    blurb: >
      Four organ chords, 7.5 s each, overlapping so nothing fully releases. The
      second is the Neapolitan — a major triad a semitone above the tonic.
    base: {towerL: seance, towerR: seance, door: chill}
    zones:
      towerL: {phase: 0.9}
      door: {overlay: chase}
    # Organ chord onsets pulse all zones gently, in the room's own violet.
    pulse:
      - {synth: organ, intensity: 0.18, color: [0.66, 0.20, 1.0, 0.10], decay: 0.955}
    score:
      - {t: 0.0,  synth: wind,  dur: 35.0, gain: 0.35}
      - {t: 0.0,  synth: organ, gain: 1.0}
      - {t: 16.4, synth: toll,  gain: 0.8}
    cues:
      - {t: 6600,  op: strike, zone: towerL, ms: 900, note: "Neapolitan"}
      - {t: 6800,  op: set, zone: towerR, effect: wisp}
      - {t: 13200, op: set, zone: towerR, effect: seance}
      - {t: 19800, op: strike, ms: 1100, note: "the flat ninth"}
      - {t: 20000, op: set, zone: towerL, effect: wisp}
      - {t: 20200, op: set, zone: door,   effect: throb}
      - {t: 27500, op: set, zone: towerL, effect: seance}
      - {t: 28200, op: set, zone: door,   effect: chill}

  - id: ballroom
    name: Ballroom
    kind: ambient
    volume: 0.55
    duration_ms: 15000
    loop: true
    blurb: >
      The parlour waltz — music box over piano, three-four time. All three zones
      drift slowly between violet and green.
    base: {towerL: mansion, towerR: mansion, door: mansion}
    zones:
      towerL: {overlay: sparkle}
      towerR: {overlay: sparkle, phase: 2.3}
    # Waltz downbeats shimmer all zones; phrase heads land harder (velocity).
    pulse:
      - {synth: waltz, intensity: 0.16, color: [0.9, 0.85, 1.0, 0.25], decay: 0.93}
    score:
      - {t: 0.0, synth: waltz, gain: 1.0}
    cues:
      - {t: 4700, op: set, zone: door, effect: chill}
      - {t: 9600, op: set, zone: door, effect: mansion}

  - id: descent
    name: Descent
    kind: showpiece
    volume: 0.85
    duration_ms: 27000
    blurb: >
      A 32-foot pedal holds for the whole piece while the upper voices walk down
      chromatically. One strike per chord change, nothing hurried.
    base: {towerL: chill, towerR: chill, door: "off"}
    zones:
      towerL: {overlay: meteor, palette: moonlight}
      towerR: {overlay: meteor, palette: moonlight, phase: 1.3}
    score:
      - {t: 0.0, synth: descent, gain: 1.0}
    cues:
      - {t: 900,   op: strike, zone: door, ms: 900, note: "pedal enters"}
      - {t: 1000,  op: set, zone: door,   effect: chill}
      - {t: 1300,  op: set, zone: towerL, effect: seance}
      - {t: 7100,  op: strike, zone: towerR, ms: 700, note: "cluster II"}
      - {t: 7200,  op: set, zone: towerR, effect: seance}
      - {t: 12900, op: strike, ms: 800, note: "cluster III"}
      - {t: 13000, op: set, zone: door,   effect: throb}
      - {t: 18700, op: strike, zone: towerL, ms: 800, note: "cluster IV"}
      - {t: 18800, op: set, zone: towerL, effect: wisp}
      - {t: 19100, op: set, zone: towerR, effect: wisp}
      - {t: 20400, op: strike, ms: 1400, note: "diminished pile-up"}
      - {t: 20500, op: set, zone: door,   effect: furnace}
      - {t: 24800, op: set, zone: towerL, effect: chill}
      - {t: 25200, op: set, zone: towerR, effect: chill}
      - {t: 25800, op: set, zone: door,   effect: "off"}

  - id: visitation
    name: Visitation
    kind: triggered
    volume: 0.75
    duration_ms: 11000
    blurb: >
      Candles gutter out, both towers drift to a cold breathing green, and
      something watches from the left window.
    base: {towerL: candle, towerR: candle, door: ember}
    score:
      - {t: 0.0, synth: wind,  dur: 11.0, gain: 0.5}
      - {t: 0.0, synth: organ, gain: 0.85, take: 11.0}
      - {t: 4.2, synth: toll,  gain: 0.9}
    cues:
      - {t: 400,  op: set, zone: door,   effect: "off"}
      - {t: 900,  op: set, zone: towerR, effect: spirit}
      - {t: 1600, op: set, zone: towerL, effect: spirit}
      - {t: 4600, op: set, zone: towerL, effect: eyes}
      - {t: 9200, op: set, zone: towerL, effect: spirit}

  - id: approach
    name: Approach
    kind: motion
    volume: 1.0
    duration_ms: 8000
    blurb: >
      What the walkway sensor fires. Total blackout, a beat of nothing, then the
      door goes up like a furnace.
    base: {towerL: candle, towerR: candle, door: ember}
    score:
      - {t: 1.5, synth: creak,  gain: 1.0}
      - {t: 3.8, synth: shriek, gain: 1.0}
      - {t: 3.9, synth: thunder, gain: 0.55}
    cues:
      - {t: 0,    op: set, zone: towerL, effect: "off"}
      - {t: 0,    op: set, zone: towerR, effect: "off"}
      - {t: 0,    op: set, zone: door,   effect: "off"}
      - {t: 1900, op: set, zone: door,   effect: furnace}
      - {t: 3900, op: strike, ms: 90, note: "all zones"}
      - {t: 5400, op: set, zone: towerL, effect: candle}
      - {t: 5900, op: set, zone: towerR, effect: candle}
      - {t: 6400, op: set, zone: door,   effect: ember}

  - id: crypt
    name: Crypt
    kind: ambient
    volume: 0.7
    duration_ms: 24000
    loop: true
    blurb: >
      Below the castle. A heartbeat at 48 bpm, a tritone drone underneath, and
      whispers just past intelligibility. The lights barely admit anything is
      there — near-darkness is the effect.
    base: {towerL: chill, towerR: chill, door: blood}
    zones:
      door: {center: ember}
      towerR: {phase: 1.1}
    # The towers rest on a cold near-dark instead of true black: between
    # whispers they were dead pixels for seconds at a time. `chill` held this
    # low is a held breath — and being cold, it separates the towers (voices)
    # from the door (heart) even at rest.
    levels: {towerL: 0.35, towerR: 0.35}
    # Nothing in this scene is lit by the clock — every zone is driven by one
    # sound, and each sound owns a colour:
    #   red    = the heart      (door, both thumps of the lub-dub, snapping)
    #   green  = the voices     (towers, one flicker per whispered word,
    #                            alternating, so the voices move around you)
    #   violet = the bell       (everything blooms and falls slow)
    # The heart also throbs faintly through the towers, so the whole crypt
    # breathes with the door as the epicentre.
    #
    # The eyes are held at level 0.18 on purpose. At full brightness they are
    # a red floodlight tied to nothing in the audio, and they bury the
    # heartbeat in the same colour — the reason this scene read as flat. Kept
    # under the pulses, they are a presence you notice rather than a lamp.
    pulse:
      - {synth: heartbeat, zone: door, intensity: 0.85, decay: 0.82,
         color: [1.0, 0.03, 0.01, 0.0], pixels: center}
      - {synth: heartbeat, zones: [towerL, towerR], intensity: 0.10,
         decay: 0.88, color: [1.0, 0.05, 0.02, 0.0]}
      - {synth: whispers, zones: [towerL, towerR], alternate: true,
         intensity: 0.34, decay: 0.94, color: [0.24, 1.0, 0.38, 0.0],
         pixels: scatter}
      - {synth: toll, intensity: 0.5, decay: 0.972,
         color: [0.66, 0.08, 1.0, 0.06]}
    score:
      - {t: 0.0,  synth: drone,     dur: 24.0, gain: 0.9}
      - {t: 0.0,  synth: heartbeat, dur: 24.0, gain: 1.0}
      - {t: 2.0,  synth: whispers,  dur: 20.5, gain: 0.55}
      - {t: 14.0, synth: toll, gain: 0.3}
    cues:
      - {t: 3000,  op: set, zone: towerL, effect: eyes, level: 0.18, note: "something watches"}
      - {t: 12000, op: set, zone: towerL, effect: chill, level: 0.35, note: "eyes close"}
      - {t: 12600, op: set, zone: towerR, effect: eyes, level: 0.18, note: "…it moved"}
      - {t: 20000, op: set, zone: towerR, effect: chill, level: 0.35, note: "gone"}

  - id: the_citizens_of_halloween___this
    name: The Citizens Of Halloween   This
    kind: custom
    volume: 0.7
    duration_ms: 193360
    loop: true
    blurb: >
      Imported track. Light cues are onset-detected from the audio
      itself, so they follow whatever the track actually does.
    audio_file: tracks/the_citizens_of_halloween___this.mp3
    base: {towerL: chill, towerR: chill, door: ember}
    levels: {towerL: 0.4, towerR: 0.4, door: 0.5}
    zones:
      towerL: {center: ember, palette: haunt}
      towerR: {center: ember, palette: moonlight, phase: 1.3}
      door: {overlay: sparkle, palette: ember}
    pulse:
      - {synth: onset_low, zones: [door], intensity: 0.85, decay: 0.9, ms: 140, colors: [[1, 0.04, 0, 0], [1, 0.18, 0, 0], [0.85, 0, 0.25, 0]], color_hot: [1, 0.45, 0.02, 0.1], pixels_by_vel: true, boost_at: 0.85, boost_targets: [towerL, towerR]}   # 497 onsets in 20-200Hz
      - {synth: onset_mid, zones: [towerL, towerR], alternate: true, intensity: 0.8, decay: 0.945, ms: 160, attack_ms: 90, colors: [[0.55, 0, 1, 0], [1, 0, 0.75, 0], [0.25, 0.12, 1, 0]], color_hot: [1, 0.15, 0.85, 0.12], pixels_by_vel: true}   # 452 onsets in 200-2000Hz
      - {synth: onset_high, zones: [towerR, door, towerL], alternate: true, intensity: 0.72, decay: 0.95, ms: 130, colors: [[0.05, 1, 0.35, 0], [0, 0.85, 1, 0], [0.65, 1, 0, 0]], color_hot: [0.25, 1, 0.7, 0.15], pixels: scatter}   # 296 onsets in 2000-16000Hz
    cues:
      - {t: 0, op: set, zone: towerL, effect: chill, level: 0.4, note: hush}
      - {t: 0, op: set, zone: towerR, effect: chill, level: 0.4, note: hush}
      - {t: 0, op: set, zone: door, effect: ember, level: 0.5, note: hush}
      - {t: 2500, op: set, zone: towerL, effect: seance, level: 0.7, note: verse}
      - {t: 2500, op: set, zone: towerR, effect: seance, level: 0.7, note: verse}
      - {t: 2500, op: set, zone: door, effect: ember, level: 0.8, note: verse}
      - {t: 12800, op: set, zone: towerL, effect: seance, level: 0.315, note: predim}
      - {t: 12800, op: set, zone: towerR, effect: seance, level: 0.315, note: predim}
      - {t: 12800, op: set, zone: door, effect: ember, level: 0.36, note: predim}
      - {t: 13250, op: set, zone: towerL, effect: mansion, level: 0.95, note: chorus}
      - {t: 13250, op: set, zone: towerR, effect: mansion, level: 0.95, note: chorus}
      - {t: 13250, op: set, zone: door, effect: furnace, level: 0.95, note: chorus}
      - {t: 18000, op: set, zone: towerL, effect: seance, level: 0.7, note: verse}
      - {t: 18000, op: set, zone: towerR, effect: seance, level: 0.7, note: verse}
      - {t: 18000, op: set, zone: door, effect: ember, level: 0.8, note: verse}
      - {t: 120550, op: set, zone: towerL, effect: seance, level: 0.315, note: predim}
      - {t: 120550, op: set, zone: towerR, effect: seance, level: 0.315, note: predim}
      - {t: 120550, op: set, zone: door, effect: ember, level: 0.36, note: predim}
      - {t: 121000, op: set, zone: towerL, effect: mansion, level: 0.95, note: chorus}
      - {t: 121000, op: set, zone: towerR, effect: mansion, level: 0.95, note: chorus}
      - {t: 121000, op: set, zone: door, effect: furnace, level: 0.95, note: chorus}
      - {t: 125500, op: set, zone: towerL, effect: seance, level: 0.7, note: verse}
      - {t: 125500, op: set, zone: towerR, effect: seance, level: 0.7, note: verse}
      - {t: 125500, op: set, zone: door, effect: ember, level: 0.8, note: verse}
      - {t: 143000, op: set, zone: towerL, effect: chill, level: 0.4, note: hush}
      - {t: 143000, op: set, zone: towerR, effect: chill, level: 0.4, note: hush}
      - {t: 143000, op: set, zone: door, effect: ember, level: 0.5, note: hush}
      - {t: 157050, op: set, zone: towerL, effect: chill, level: 0.18, note: predim}
      - {t: 157050, op: set, zone: towerR, effect: chill, level: 0.18, note: predim}
      - {t: 157050, op: set, zone: door, effect: ember, level: 0.225, note: predim}
      - {t: 157500, op: set, zone: towerL, effect: mansion, level: 0.95, note: chorus}
      - {t: 157500, op: set, zone: towerR, effect: mansion, level: 0.95, note: chorus}
      - {t: 157500, op: set, zone: door, effect: furnace, level: 0.95, note: chorus}
      - {t: 159000, op: set, zone: towerL, effect: seance, level: 0.7, note: verse}
      - {t: 159000, op: set, zone: towerR, effect: seance, level: 0.7, note: verse}
      - {t: 159000, op: set, zone: door, effect: ember, level: 0.8, note: verse}
      - {t: 182000, op: set, zone: towerL, effect: chill, level: 0.4, note: hush}
      - {t: 182000, op: set, zone: towerR, effect: chill, level: 0.4, note: hush}
      - {t: 182000, op: set, zone: door, effect: ember, level: 0.5, note: hush}
      - {t: 188750, op: set, zone: towerL, effect: chill, level: 0.06, note: silence}
      - {t: 188750, op: set, zone: towerR, effect: chill, level: 0.06, note: silence}
      - {t: 188750, op: set, zone: door, effect: ember, level: 0.08, note: silence}
