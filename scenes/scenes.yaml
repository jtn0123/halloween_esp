      towerL: {center: ember, palette: haunt}
      towerR: {center: ember, palette: moonlight, phase: 1.3}
      door: {overlay: sparkle, palette: ember}
    pulse:
      - {synth: onset_low, zones: [door], intensity: 0.85, decay: 0.9, ms: 140, colors: [[1, 0.04, 0, 0], [1, 0.18, 0, 0], [0.85, 0, 0.25, 0]], color_hot: [1, 0.45, 0.02, 0.1], pixels_by_vel: true, boost_at: 0.85, boost_targets: [towerL, towerR]}   # 213 onsets in 20-200Hz
      - {synth: onset_mid, zones: [towerL, towerR], alternate: true, intensity: 0.8, decay: 0.945, ms: 160, attack_ms: 90, colors: [[0.55, 0, 1, 0], [1, 0, 0.75, 0], [0.25, 0.12, 1, 0]], color_hot: [1, 0.15, 0.85, 0.12], pixels_by_vel: true}   # 256 onsets in 200-2000Hz
      - {synth: onset_high, zones: [towerR, door, towerL], alternate: true, intensity: 0.72, decay: 0.95, ms: 130, colors: [[0.05, 1, 0.35, 0], [0, 0.85, 1, 0], [0.65, 1, 0, 0]], color_hot: [0.25, 1, 0.7, 0.15], pixels: scatter}   # 211 onsets in 2000-16000Hz
