version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    assignees: [jtn0123]
    groups:
      # esphome and aioesphomeapi move together or not at all: requirements.txt
      # constrains aioesphomeapi, and a new esphome almost always requires a
      # newer one — so ungrouped, the two PRs block each other and the whole
      # advisory backlog behind them sits still. One PR, one resolution.
      # (grade report 2026-08-31 F1)
      esphome:
        patterns:
          - esphome
          - aioesphomeapi
      python-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # aioesphomeapi majors are not ours to take: esphome pins the version
      # EXACTLY (2026.9.0 wants ==46.3.0), so an offer of the next major is
      # unmergeable on merit however green its checks look — the resolver
      # would simply refuse it. PR #13 was that PR for 46, and it sat UNSTABLE
      # for weeks proving it; 46 arrived with esphome 2026.9.0 instead. The
      # version moves when esphome moves, which the group above delivers as
      # one PR. (grade report 2026-09-01 F2)
      #
      # And minors and patches too: requirements.txt holds only a floor, so
      # a bump with no esphome release beside it raises the floor past
      # esphome's exact pin and can never install (PR #47, >=46.5.0 against
      # ==46.3.0). requirements.lock is what moves when esphome moves.
      - dependency-name: aioesphomeapi

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    assignees: [jtn0123]
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # castle-core is zero-dependency on purpose and Cargo.lock is empty, so this
  # block is a no-op today — which is exactly when to add it (grade report
  # 2026-08-31 F4). The first crate dependency the show ever takes arrives
  # already scanned, instead of arriving and then waiting for someone to
  # notice the gap.
  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    assignees: [jtn0123]
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    assignees: [jtn0123]
