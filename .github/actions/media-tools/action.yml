name: media tools
description: Install ffmpeg and lame, and survive a bad Ubuntu mirror.

# Three jobs need these, so the recovery logic lives in one place rather than
# being pasted three times.
#
# The thing that actually goes wrong is `apt-get update`, not the install.
# Measured on 2026-08-18: a healthy update takes ~12s, but on a degraded Azure
# mirror it does not fail, it stalls — and three jobs sat on it for 27 minutes
# before anyone noticed. A later attempt to cap it at 60s went the other way
# and failed a job three times over without ever reaching the install.
#
# So the update is no longer on the common path. Runner images ship with apt
# lists already populated, and ffmpeg and lame have not moved in noble, so the
# first attempt just installs. Only when that fails — stale lists, a 404 on a
# superseded version — is a refresh worth its risk, and by then we already know
# something needs fixing.
#
# Three layers of patience, outermost last:
#   * apt's own Acquire timeouts, so a dead connection is dropped in 20s
#     instead of hanging on a socket;
#   * `timeout` around each command, so a stall that gets past those is still
#     bounded;
#   * three attempts, escalating from install-only to a full refresh.
#
# Worst case is about 16.5 minutes, and the `timeout-minutes` in ci.yml are
# sized against that number. The two have to stay in step: an earlier version
# budgeted 36 minutes of retries inside a 15-minute job and failed a run that
# had already finished every step.

runs:
  using: composite
  steps:
    - name: ffmpeg + lame
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        # Bound apt at the network layer, which is where the stall lives.
        # Without these it waits on an unresponsive mirror essentially forever.
        APT_OPTS: >-
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=20
          -o Acquire::https::Timeout=20
      run: |
        set -u

        install_pkgs() {
          # shellcheck disable=SC2086  # APT_OPTS is a deliberate word list
          timeout 240 sudo -E apt-get ${APT_OPTS} install -y \
            --no-install-recommends ffmpeg lame
        }
        refresh_lists() {
          # shellcheck disable=SC2086
          timeout 120 sudo -E apt-get ${APT_OPTS} update -qq
        }

        for attempt in 1 2 3; do
          # Attempt 1 skips the refresh entirely: the image's lists are almost
          # always good, and the refresh is the part that stalls.
          if [ "${attempt}" -gt 1 ]; then
            refresh_lists || echo "::warning::apt-get update failed on attempt ${attempt}"
          fi

          if install_pkgs; then
            # `|| true`: GitHub runs composite bash with -o pipefail, and the
            # writer of a pipe that head closes early exits non-zero. Reporting
            # the version must not be able to fail a successful install.
            ffmpeg -version | head -1 || true
            lame --version | head -1 || true
            exit 0
          fi

          echo "::warning::ffmpeg/lame install failed on attempt ${attempt}"
          # A killed apt can leave locks and a half-configured dpkg behind, and
          # the next attempt would then fail for a different reason than the one
          # worth retrying. One pkill per name: it takes a single pattern, and a
          # list would just make it complain and do nothing.
          for proc in apt-get apt dpkg; do
            sudo pkill -9 -x "${proc}" 2>/dev/null || true
          done
          sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock \
                     /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend
          sudo dpkg --configure -a || true
          sleep $((attempt * 10))
        done

        echo "::error::ffmpeg and lame could not be installed after three attempts"
        exit 1
