name: media tools
description: Install ffmpeg and lame, and survive a bad Ubuntu mirror.

# Three jobs need these, so the recovery logic lives in one place rather than
# being pasted three times.
#
# Why this is not just `apt-get install`: ffmpeg pulls about 63 MB of
# dependencies, and on a healthy runner the whole step takes some 80 seconds.
# When Azure's mirror degrades it does not fail — it stalls, and a step with
# no timeout inside a job with no timeout sits there until the six-hour
# ceiling. Observed on 2026-08-18: two jobs wedged here for 27 minutes while a
# third ran the identical command in 2m33s.
#
# So each attempt is capped, a stall is treated as a failure, and the retry
# starts from a clean package list. Three strikes and the job fails loudly,
# which is a far better outcome than a queue that never drains.

runs:
  using: composite
  steps:
    - name: ffmpeg + lame
      shell: bash
      run: |
        set -u
        for attempt in 1 2 3; do
          if timeout 300 sudo apt-get update -qq \
             && timeout 420 sudo apt-get install -y --no-install-recommends ffmpeg lame; then
            # `|| true`: GitHub runs composite bash with -o pipefail, and the
            # writer of a pipe that head closes early exits non-zero. Reporting
            # the version must not be able to fail a successful install.
            ffmpeg -version | head -1 || true
            lame --version | head -1 || true
            exit 0
          fi
          echo "::warning::apt attempt ${attempt} failed or timed out; retrying"
          # A killed apt can leave locks and a half-configured dpkg behind,
          # and the next attempt would then fail for a different reason than
          # the one worth retrying. One pkill per name: it takes a single
          # pattern, and a list would just make it complain and do nothing.
          for proc in apt-get apt dpkg; do
            sudo pkill -9 -x "${proc}" 2>/dev/null || true
          done
          sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock \
                     /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend
          sudo dpkg --configure -a || true
          sudo rm -rf /var/lib/apt/lists/*
          sleep $((attempt * 15))
        done
        echo "::error::ffmpeg and lame could not be installed after three attempts"
        exit 1
