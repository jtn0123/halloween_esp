# CI for the castle: the same gates `make check` runs locally, plus an
# ESPHome config validation of every buildable variant.
#
# Four parallel jobs on a PR: python, rust, web, esphome. The `rust` job is
# newer than the rest (grade report I3) — castle-core landed with no job of
# its own, so a clippy finding or a failed cargo build reported itself as
# "coverage-gated unit tests failed" three jobs away from the truth.
#
# A full firmware COMPILE is deliberately not here: the xtensa toolchain +
# ESP-IDF fetch is ~10 minutes of runner time per variant and the compile
# almost never fails when `esphome config` passes — the validation catches
# the class of bug CI exists for (a generated file referencing a missing id,
# a package merge gone wrong, the MEDIA_OUT clobber this repo has already
# lived through once).

name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The weekly firmware job below — PRs never pay the ~10 min toolchain fetch.
  schedule:
    - cron: "0 9 * * 1"

# A push that supersedes a commit should supersede its CI too. Three runs for
# this branch were alive at once on 2026-08-18, the oldest for 38 minutes on a
# commit two pushes stale, all of them queueing behind the same apt mirror.
# Main is exempt: every commit that lands there deserves its own answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # castle-core on its own: fmt, clippy, the unit tests and the wasm face,
  # nothing else in the way (grade report I3/D1). It is fast, it is cached,
  # and when it is red the checks list says "rust".
  rust:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # No media tools, no pip, no npm — this budget is a cold cargo cache
    # (release + LTO for a zero-dependency crate) and clippy, twice over.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Keep the channel equal to core/rust-toolchain.toml's. The action
      # looks for a toolchain file at the REPO ROOT and ours lives in core/,
      # so it cannot read the pin — hence the literal. rustup does read it
      # once cargo runs (the make targets cd into core/), so a mismatch here
      # shows up as this step installing a toolchain nothing then uses.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # The same words a developer types. `make rust-lint` is rustfmt --check
      # then clippy -D warnings; tests/test_castle_core.py asserts on these
      # exact targets, so the gate has one definition (grade report I1).
      - name: fmt + clippy
        run: make rust-lint
      - name: unit tests
        run: make rust-test
      # The desk's wasm face. Built here rather than discovered mid-Python-
      # suite; test_castle_core.py still loads and checks it in node.
      - name: wasm face builds
        run: cargo build --release --target wasm32-unknown-unknown
        working-directory: core

  python:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Every timeout here has to clear the media-tools retry budget (~16.5 min
    # worst case) plus the job's own work, or a job that finished cleanly gets
    # failed by its own clock. That happened at 15 minutes on the first try.
    # Held at 25 even though the `rust` job above took fmt/clippy/cargo-test
    # out of here: what stayed is a cargo build (the parity suites spawn the
    # release binaries) and the wasm check, and the media budget dominates.
    timeout-minutes: 25
    env:
      # The three toolchain gates belong to the `rust` job — routed, not
      # dropped; see the constant of the same name in tests/test_castle_core.py.
      CASTLE_RUST_GATES_ELSEWHERE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The parity suites (test_*_rust) shell out to core/target/release/*,
      # and the wasm check needs the wasm32 std — neither existed on this
      # runner before, which is how the whole Rust port merged unvalidated
      # (grade report D1). Built in an explicit step so a compile error reads
      # as one, and so tools/core_bins.py finds it fresh and skips its own
      # build in every child process it spawns (B6).
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: build castle-core
        run: make rust
      # ffmpeg: analyze.py decodes through it, and several tests exercise
      # that path — without it the whole test_analysis module errors out.
      - uses: ./.github/actions/media-tools
      # yt-dlp: two tests assert the import toolchain is present and that
      # probe/import guards reject junk BEFORE shelling out to it.
      # The lock IS what was tested locally (frozen from the 3.13 venv by `make lock`).
      - run: pip install -r requirements.lock
      # esbuild: the sandbox guard runs all three generators end to end, and
      # gen_previewer.py bundles web/src through it. Without node_modules that
      # test fails on the environment rather than on the guard it exists for.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: lint
        run: ruff check tools tests
      - name: type check
        run: mypy tools tests
      # The unit suite runs under coverage.py so the number is a ratchet,
      # not a report: the floor is the Makefile's COVERAGE_MIN (82% of
      # tools/ as of 2026-08-23); raise it there as coverage lands.
      - name: unit tests (coverage-gated)
        run: make coverage-gate PY=python
      - name: LOC cap
        run: python tools/check_loc.py
      # Advisories against the locked venv. Informational only — see the
      # `audit` target's comment in the Makefile for what is ignored and why.
      - name: pip-audit (non-gating)
        continue-on-error: true
        run: make audit PY=python

  web:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The 148-test browser suite is also the parity gate for the Rust studio:
    # both servers answer the same 20+19 routes, so the same specs passing
    # against both IS the proof (grade report D5). It had been run against the
    # Rust half exactly once, by hand. fail-fast off — when one server breaks,
    # the other axis's result is the most useful thing on the page.
    strategy:
      fail-fast: false
      matrix:
        studio: [python, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The e2e suite drives the REAL studio server, whose launch command is
      # .venv/bin/python — so the venv and its media tools must exist here.
      - uses: ./.github/actions/media-tools
      - name: studio server venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet numpy scipy pyyaml
      # render_audio.py renders THROUGH castle-core (scene_render), and with
      # no binary and no cargo it hard-stops rather than falling back to the
      # machine-dependent Python reference — tools/core_bins.py, by design.
      # Built once here, explicitly: the mtime check then keeps every render
      # child from re-running cargo's freshness pass (grade report B6).
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: build castle-core
        run: make rust
      # audio/*.mp3 are gitignored, and show_sim checks every scene has one.
      # Seconds to render, and it keeps that check real in CI instead of
      # skipped. The one scene built on the user's own import renders without
      # it (tracks/ is theirs, not the repo's) and says so.
      - name: render scene audio
        run: .venv/bin/python tools/render_audio.py
      - run: npm ci
        working-directory: web
      # The previewer page is generated, not tracked (2 MB a revision was
      # the whole repo's growth); the e2e global-setup refuses to run
      # without it. After npm ci: the build inlines an esbuild bundle.
      - name: build previewer page
        run: .venv/bin/python tools/gen_previewer.py
      # Server-independent — once per push, not once per matrix axis.
      - if: matrix.studio == 'python'
        run: npx tsc --noEmit
        working-directory: web
      - name: engine unit tests
        if: matrix.studio == 'python'
        run: npm test
        working-directory: web
      - name: browser tests
        # Named for both axes rather than defaulted, because playwright.config
        # falls back with `??`: an empty CASTLE_STUDIO_CMD is not absent, it is
        # a server command of "". The paths are relative to web/, the config's
        # own directory, and the port and --localhost are appended there.
        env:
          CASTLE_STUDIO_CMD: ${{ matrix.studio == 'rust'
            && '../core/target/release/studio'
            || '../.venv/bin/python ../tools/studio.py' }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        working-directory: web

  esphome:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # ffmpeg + numpy/scipy: the flash build embeds audio/*.mp3, which are
      # gitignored — CI has to render them before validation or the config
      # references files that do not exist.
      - uses: ./.github/actions/media-tools
      - run: pip install "esphome==2026.7.4" pyyaml numpy scipy
      # Same reason as the web job: the renderer is the Rust binary now.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: build castle-core
        run: make rust
      - name: render scene audio
        run: python tools/render_audio.py
      - name: generate
        run: python tools/gen_esphome.py
      # Validation needs the KEYS to resolve, not real credentials — and a
      # literal here reads as a hardcoded password to anything scanning the
      # repo, so the value comes from the run rather than from the file.
      - name: fake secrets
        env:
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          printf 'wifi_ssid: "ci"\nwifi_password: "%s"\n' "$RUN" \
            > firmware/secrets.yaml
      # No `> /dev/null`: esphome prints its ERRORS to stdout, and piping it
      # away turned every validation failure into a bare "exit code 2".
      - name: validate every buildable variant
        run: |
          for y in castle_flash castle_sd castle_sd_jewels bench; do
            esphome config "firmware/$y.yaml" > "/tmp/$y.out" 2>&1 \
              || { echo "== $y FAILED"; cat "/tmp/$y.out"; exit 1; }
            echo "$y OK"
          done

  # `esphome config` cannot see the failure mode that is now closest: the
  # S2's dram0 sits at ~88% and each song scene costs ~9 KB (grade report
  # D5/G2). Once a week, actually compile the SD build and fail while the
  # ceiling is still a warning — and say whether a newer esphome exists,
  # because the pin is what holds eight stale advisories in place (F1).
  firmware-weekly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: ./.github/actions/media-tools
      # From the LOCK, wheels only: exact resolved versions (the same set
      # every other gate tested against) and no sdist setup.py execution —
      # the two things Sonar rightly flagged on the unpinned spelling.
      - run: pip install --only-binary=":all:" -r requirements.lock
      - name: render + generate
        run: |
          python tools/render_audio.py
          python tools/gen_esphome.py
      - name: fake secrets
        env:
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          printf 'wifi_ssid: "ci"\nwifi_password: "%s"\n' "$RUN" \
            > firmware/secrets.yaml
      - name: compile the SD build
        run: esphome compile firmware/castle_sd.yaml | tee /tmp/build.out
      - name: dram0 ceiling
        run: |
          PCT=$(grep -Eo 'RAM: *\[[^]]*\] *[0-9.]+%' /tmp/build.out | grep -Eo '[0-9.]+%' | tr -d '%')
          echo "dram0 at ${PCT}%"
          python3 -c "import sys; p=float('${PCT}' or 101); sys.exit(0 if p < 92.0 else print(f'dram0 {p}% is over the 92% alarm — about one scene of headroom left (grade report G2); split or cap before adding more') or 1)"
      - name: newer esphome available?
        run: |
          pip index versions esphome 2>/dev/null | head -2 || true
          echo "pin is 2026.7.4 — a bump clears the cryptography advisory (see .pip-audit-ignore)"
