# CI for the castle: the same gates `make check` runs locally, plus an
# ESPHome config validation of every buildable variant.
#
# Four parallel jobs on a PR: python, rust, web, esphome. The `rust` job is
# newer than the rest (grade report 2026-08-31 I3) — castle-core landed with no job of
# its own, so a clippy finding or a failed cargo build reported itself as
# "coverage-gated unit tests failed" three jobs away from the truth.
#
# A full firmware COMPILE is deliberately not here: the xtensa toolchain +
# ESP-IDF fetch is ~10 minutes of runner time per variant and the compile
# almost never fails when `esphome config` passes — the validation catches
# the class of bug CI exists for (a generated file referencing a missing id,
# a package merge gone wrong, the MEDIA_OUT clobber this repo has already
# lived through once). The compile is firmware.yml: weekly, by hand, and on
# any PR that touches firmware/ — its own file since 2026-10-02, when the
# buyer image joined it and this one reached the 500-line rule.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Every `run:` step is `bash -eo pipefail`. GitHub's default for a plain
# step is `bash -e` with NO pipefail, so `esphome compile … | tee` reported
# tee's exit status — always 0 — and the weekly compile could not fail
# (grade report 2026-09-06 D1). Composite actions already ran with pipefail
# (.github/actions/media-tools); now the workflow's own steps do too.
defaults:
  run:
    shell: bash -eo pipefail {0}

# A push that supersedes a commit should supersede its CI too. Three runs for
# this branch were alive at once on 2026-08-18, the oldest for 38 minutes on a
# commit two pushes stale, all of them queueing behind the same apt mirror.
# Main is exempt: every commit that lands there deserves its own answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # castle-core on its own: fmt, clippy, the unit tests and the wasm face,
  # nothing else in the way (grade report 2026-08-31 I3/D1). It is fast, it is cached,
  # and when it is red the checks list says "rust".
  rust:
    runs-on: ubuntu-latest
    # No media tools, no pip, no npm — this budget is a cold cargo cache
    # (release + LTO for a zero-dependency crate) and clippy, twice over.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Keep the channel equal to core/rust-toolchain.toml's. The action
      # looks for a toolchain file at the REPO ROOT and ours lives in core/,
      # so it cannot read the pin — hence the literal. rustup does read it
      # once cargo runs (the make targets cd into core/), so a mismatch here
      # shows up as this step installing a toolchain nothing then uses.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      # The same words a developer types. `make rust-lint` is rustfmt --check
      # then clippy -D warnings; tests/test_castle_core.py asserts on these
      # exact targets, so the gate has one definition (grade report 2026-08-31 I1).
      - name: fmt + clippy
        run: make rust-lint
      - name: unit tests
        run: make rust-test
      # The desk's wasm face. Built here rather than discovered mid-Python-
      # suite; test_castle_core.py still loads and checks it in node.
      # --no-default-features is the wasm build now: the crate's `native`
      # half (server, ffmpeg, flock) is gated off for a target that cannot
      # run it, and building WITH the defaults here would fail (A1).
      - name: wasm face builds
        run: cargo build --locked --release --no-default-features --target wasm32-unknown-unknown
        working-directory: core

  python:
    runs-on: ubuntu-latest
    # Every timeout here has to clear the media-tools retry budget (~16.5 min
    # worst case) plus the job's own work, or a job that finished cleanly gets
    # failed by its own clock. That happened at 15 minutes on the first try.
    # Held at 25 even though the `rust` job above took fmt/clippy/cargo-test
    # out of here: what stayed is a cargo build (the parity suites spawn the
    # release binaries) and the wasm check, and the media budget dominates.
    timeout-minutes: 25
    env:
      # The three toolchain gates belong to the `rust` job — routed, not
      # dropped; see RUST_GATES_ELSEWHERE in tests/test_castle_core.py. Not a
      # CASTLE_* name on purpose: that prefix is the sandbox-knob namespace
      # test_hermetic.py holds empty.
      CI_RUST_GATES_ELSEWHERE: "1"
      # GitHub's runners are AVX-512 hosts (Zen 5 EPYC as of 2026-09), where
      # numpy dispatches vector kernels for exp/log/pow and for pocketfft —
      # arithmetic no probe profile can describe, so the parity suites drift a
      # last ulp (tests/synth_probes.py assert_libm_transcendentals). Pinning
      # numpy to its baseline loops keeps the reference reproducible.
      #
      # These names must be numpy's OWN dispatch targets, and numpy 2.5's
      # x86-64 wheel renamed them to microarchitecture LEVELS: `__cpu_dispatch__`
      # is X86_V3 X86_V4 AVX512_ICL AVX512_SPR. The per-feature spelling this
      # line used to carry (AVX512F, AVX512_SKX…) is no longer a target, so
      # numpy answered with an ImportWarning, disabled nothing, and CI stayed
      # red while looking like it had been told. The guard prints the live list
      # when it fires — read it there rather than guessing here.
      NPY_DISABLE_CPU_FEATURES: "X86_V3 X86_V4 AVX512_ICL AVX512_SPR"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The parity suites (test_*_rust) shell out to core/target/release/*,
      # and the wasm check needs the wasm32 std — neither existed on this
      # runner before, which is how the whole Rust port merged unvalidated
      # (grade report 2026-08-31 D1). Built in an explicit step so a compile error reads
      # as one, and so tools/core_bins.py finds it fresh and skips its own
      # build in every child process it spawns (B6).
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - name: build castle-core
        run: make rust
      # ffmpeg: analyze.py decodes through it, and several tests exercise
      # that path — without it the whole test_analysis module errors out.
      - uses: ./.github/actions/media-tools
      # yt-dlp: two tests assert the import toolchain is present and that
      # probe/import guards reject junk BEFORE shelling out to it.
      # The lock IS what was tested locally (frozen from the 3.13 venv by `make lock`).
      - run: pip install --require-hashes --only-binary=":all:" --no-binary crcmod,esptool,paho-mqtt -r requirements.lock
      # …but the lock is ALL any job installs, so nothing here ever asked the
      # resolver whether requirements.txt is still satisfiable. Dependabot
      # walked straight through that gap: PR #13's own log shows the job
      # installing the version the PR claimed to replace (grade report
      # 2026-09-01 F1). This resolves the constraint files and installs
      # nothing — metadata only, seconds, no environment touched.
      #
      # tests/test_lock_deps.py holds the other half (every txt specifier is
      # satisfied by its lock pin) and needs no network; this step catches the
      # case that one cannot see — a constraint set that is internally
      # unsatisfiable while each pin still looks fine on its own.
      - name: resolve the requirement files
        run: |
          pip install --dry-run --quiet --report /dev/null --only-binary=":all:" --no-binary crcmod,esptool,paho-mqtt \
            -r requirements.txt -r requirements-dev.txt
      # esbuild: the sandbox guard runs all three generators end to end, and
      # gen_previewer.py bundles web/src through it. Without node_modules that
      # test fails on the environment rather than on the guard it exists for.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: lint
        run: ruff check tools tests demo/castle-radio
      # `make lint` and the pre-commit hook run this; CI did not, so a web
      # edit or a Dependabot PR could land formatting drift that reddened the
      # next person's `make check` (grade report 2026-09-06 D3).
      - name: ruff format
        run: ruff format --check tools tests demo/castle-radio
      - name: type check
        run: mypy tools tests demo/castle-radio
      # The unit suite runs under coverage.py so the number is a ratchet,
      # not a report: the floor is the Makefile's COVERAGE_MIN (82% of
      # tools/ as of 2026-08-23); raise it there as coverage lands.
      - name: unit tests (coverage-gated)
        run: make coverage-gate PY=python
      # The control room's own suite (bridge, jobs, device page, browser
      # sources under node:test) lived only in `make test-radio` until 2026-09-15.
      - name: castle radio tests
        run: make test-radio PY=python
      # Its Python half again, under its own coverage floor: the tools/ number
      # never measured this directory (grade report 2026-09-17 D2).
      - name: castle radio coverage
        run: make coverage-radio PY=python
      - name: LOC cap
        run: python tools/check_loc.py
      # Every grade-report citation names its audit. IDs renumber, so a bare
      # one points at every report and none of them.
      - name: citation dates
        run: python tools/check_citations.py
      # Advisories against the locked venv. Informational only — see the
      # `audit` target's comment in the Makefile for what is ignored and why.
      - name: pip-audit (non-gating)
        continue-on-error: true
        run: make audit PY=python

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One axis since docs/RETIREMENT.md. This job ran the 148-test browser
    # suite twice, once per server, because the same specs passing against
    # both WAS the parity proof (grade report 2026-08-31 D5). There is one
    # server now, so the second run proved nothing and cost the same.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The studio spawns Python children for every render, import and
      # generator run — so the venv and its media tools must exist here even
      # though the server itself is a Rust binary.
      - uses: ./.github/actions/media-tools
      # The whole hashed lock, not three names constrained by it: `-c` pins a
      # version and trusts the index for the bytes, and this venv renders
      # what the studio serves (grade report 2026-09-24 E1).
      - name: studio server venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --require-hashes --only-binary=":all:" --no-binary crcmod,esptool,paho-mqtt -r requirements.lock
      # render_audio.py renders THROUGH castle-core (scene_render), and with
      # no binary and no cargo it hard-stops rather than falling back to the
      # machine-dependent Python reference — tools/core_bins.py, by design.
      # Built once here, explicitly: the mtime check then keeps every render
      # child from re-running cargo's freshness pass (grade report 2026-08-31 B6).
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - name: build castle-core
        run: make rust
      # audio/*.mp3 are gitignored, and show_sim checks every scene has one.
      # Seconds to render, and it keeps that check real in CI instead of
      # skipped. The one scene built on the user's own import renders without
      # it (tracks/ is theirs, not the repo's) and says so.
      - name: render scene audio
        run: .venv/bin/python tools/render_audio.py
      - run: npm ci --ignore-scripts
        working-directory: web
      # The previewer page is generated, not tracked (2 MB a revision was
      # the whole repo's growth); the e2e global-setup refuses to run
      # without it. After npm ci: the build inlines an esbuild bundle.
      - name: build previewer page
        run: .venv/bin/python tools/gen_previewer.py
      # The page-weight budget can only be measured where the page exists,
      # which is here and not in the `python` job — where it had only ever
      # produced a FileNotFoundError (grade report 2026-08-31 D1).

      - name: previewer page budget
        run: .venv/bin/python -m unittest -q tests.test_previewer_budget.TestPageWeight
      - run: npx --no-install tsc --noEmit
        working-directory: web
      - name: engine unit tests
        run: npm test
        working-directory: web
      - name: install browsers
        id: browsers
        run: npx --no-install playwright install --with-deps chromium webkit
        working-directory: web
      - name: browser tests (chromium)
        # Named rather than defaulted, because playwright.config falls back
        # with `??`: an empty CASTLE_STUDIO_CMD is not absent, it is a server
        # command of "". The path is relative to web/, the config's own
        # directory, and the port and --localhost are appended there.
        env:
          CASTLE_STUDIO_CMD: ../core/target/release/studio
        run: npx --no-install playwright test --project=chromium
        working-directory: web
      # WebKit is Safari's engine and the desktop app's macOS window
      # (docs/PRODUCTION-TODO.md §5.1). Its own run — its own server and
      # scratch tracks, as the specs expect — and it still runs when the
      # Chromium step is red, so one browser's failure never hides the other's.
      - name: browser tests (webkit)
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        env:
          CASTLE_STUDIO_CMD: ../core/target/release/studio
        run: npx --no-install playwright test --project=webkit
        working-directory: web

  esphome:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # ffmpeg + numpy/scipy: the flash build embeds audio/*.mp3, which are
      # gitignored — CI has to render them before validation or the config
      # references files that do not exist.
      - uses: ./.github/actions/media-tools
      # The esphome pin is never repeated here: the lock carries it at
      # requirements.txt's version (tests/test_lock_deps.py holds the two
      # equal), so installing the hashed lock installs the pinned esphome BY
      # ITS BYTES. This job builds the image flashed to the castle; it used to
      # take three names under `-c`, which checks versions and no digests
      # (grade report 2026-09-24 E1).
      - name: install the pinned esphome
        run: |
          echo "installing $(grep -E '^esphome==' requirements.txt) from the hashed lock"
          pip install --require-hashes --only-binary=":all:" --no-binary crcmod,esptool,paho-mqtt -r requirements.lock
      # Same reason as the web job: the renderer is the Rust binary now.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - name: build castle-core
        run: make rust
      - name: render scene audio
        run: python tools/render_audio.py
      - name: generate
        run: python tools/gen_esphome.py
      # Validation needs the KEYS to resolve, not real credentials — and a
      # literal here reads as a hardcoded password to anything scanning the
      # repo, so the value comes from the run rather than from the file.
      - name: fake secrets
        env:
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          printf 'wifi_ssid: "ci"\nwifi_password: "%s"\n' "$RUN" \
            > firmware/secrets.yaml
      # No `> /dev/null`: esphome prints its ERRORS to stdout, and piping it
      # away turned every validation failure into a bare "exit code 2".
      - name: validate every buildable variant
        run: |
          for y in castle_feather_s3 castle_buyer castle_s3 castle_s3_qemu bench bench_audio; do
            esphome config "firmware/$y.yaml" > "/tmp/$y.out" 2>&1 \
              || { echo "== $y FAILED"; cat "/tmp/$y.out"; exit 1; }
            echo "$y OK"
          done
