# The castles this repo knows about. Tools resolve a device in this order:
#   1. an explicit ip/name on the command line
#   2. the CASTLE_HOST environment variable
#   3. the first entry in this file
#
# mDNS does not work on the ESP32-S2 (see HARDWARE_FINDINGS), so give the
# device a DHCP reservation in the router and record the address here once.

[castle-sd]
# 2026-08-22: the NEW board (MAC 84:f7:03:d7:99:3c, rewired, speakers on)
# — the router's lease for it today. The old board kept .187 and is being
# retired; it is deliberately not a fallback. Make the DHCP reservation for
# this MAC and point this at it when you get a minute.
host = "10.27.27.247"
# Tried in order when `host` stops answering (castle_link.castle_hosts) —
# the safety net until that reservation exists. .238 and .142 were the
# leases the previous board had; harmless to keep until the new one moves.
fallbacks = ["10.27.27.238", "10.27.27.142"]
